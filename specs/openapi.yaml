  /api/v1/admin/users/{user_id}/privileges:
    patch:
      tags:
      - Administration
      summary: Change exactly one existing user privilege
      description: >-
        Delegates to Core adminUpdateUserPrivilege(userId, privilege, enabled).
        Requires bearer-authenticated active is_superuser=true authority
        independently of is_staff. Both backends check current saved roles on
        every request; token role claims and operation keys are not authority.
        Staff-only, inactive and operation-key-only callers receive 403;
        missing/invalid authentication receives 401. Authorization precedes
        target lookup or disclosure. Changes only the selected staff or
        superuser privilege and preserves the other flag and all other account
        fields. Granting superuser does not grant staff. Any existing account
        may be targeted, including inactive users, existing superusers and the
        actor. Revocation of an active user's superuser privilege, including
        self-demotion, requires another active superuser to remain; otherwise
        return 409 without writes. Concurrent revocations must preserve this
        invariant; any denied or failed update has no partial writes.
        Return the saved user projection only after commit. Subsequent
        authorization checks in already-active sessions use saved flags.
        No credential, authentication secret or internal error detail is
        returned. The privilege discriminator is exactly is_staff or
        is_superuser. Core LAST_ACTIVE_SUPERUSER maps to HTTP 409. Existing staff
        operational behavior is unchanged. All responses are non-cacheable and
        sanitized.
      operationId: adminUpdateUserPrivilege
      x-implementation-status: planned
      security:
      - BearerAuth: []
      parameters:
      - name: user_id
        in: path
        required: true
        description: Existing account identifier, unchanged from AdminUser.id and Core User.id.
        schema:
