  /api/v1/orders/{order_id}/retry-payment:
    post:
      tags:
      - Orders
      summary: Initialize a new payment attempt for an eligible order
      operationId: retryOrderPayment
      description: >-
        Rejected or pending orders can be retried when they have no unresolved
        payment attempt, unreleased payment review, or credit retry guard. An unresolved
        attempt returns PENDING_PAYMENT. An unreleased payment review returns
        PAYMENT_REQUIRES_REVIEW and does not unblock automatically.
      security:
      - BearerAuth: []
      - XOpKey: []
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Order and new checkout URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400':
          description: The order identifier is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '404':
          description: The order does not exist or is not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '409':
          description: A payment attempt requires reconciliation (PENDING_PAYMENT), or a payment requires manual review (PAYMENT_REQUIRES_REVIEW).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '422':
          description: The order cannot be paid again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '502':
          description: Core is unavailable or payment initialization failed.
          content:
            application/json:
              schema:
