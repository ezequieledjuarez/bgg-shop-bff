        '400':
          $ref: '#/components/responses/CreditInvalidRequest'
        '401':
          $ref: '#/components/responses/CreditUnauthorized'
        '409':
          description: Sanitized error when the idempotency key was previously used for a different request.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CreditCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditErrorResponse'
        '422':
          description: Sanitized error when the card cannot be redeemed; invalid and used codes return the same error.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CreditCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditErrorResponse'
        '502':
          $ref: '#/components/responses/CreditUpstreamFailure'
  /api/v1/checkout/credit:
    post:
      tags:
      - Orders
      - Credit
      summary: Create and pay for an order using account credit
      operationId: checkoutWithCredit
      description: >-
        The authenticated buyer is determined from the bearer token and the server
        calculates the total. Order creation, credit debit, stock decrement, invoice
        creation, and purchased cart quantity updates are atomic. Insufficient credit
        or stock causes no partial changes. No payment provider is called.
        A pending Mercado Pago order owned by the buyer blocks a new credit checkout.
        After the pending order is resolved, start a new attempt with a new key.
        A 400 INVALID response is a local validation rejection and does not establish
        whether an earlier request with the key completed. If an earlier outcome is
        unknown, retry the original request with the same key. A 400
        ADDRESS_REQUIRED_RECORDED response is a Core rejection recorded against
        the key; retrying the same payload returns that rejection while its record
        is retained, and corrected input requires a new key during that period.
        The older ADDRESS_REQUIRED code is ambiguous
        and does not confirm whether the key was recorded.
        All error fields must be sanitized and must never contain gift card codes
        or bearer tokens.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CreditIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: Paid order and balance snapshot at the time of purchase.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CreditCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCheckoutResponse'
        '400':
          $ref: '#/components/responses/CreditInvalidRequest'
        '401':
          $ref: '#/components/responses/CreditUnauthorized'
        '409':
          description: Sanitized error for insufficient credit or stock, a pending payment (PENDING_PAYMENT), or an idempotency key conflict.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CreditCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditErrorResponse'
        '422':
          description: Sanitized error when the cart is empty or the order cannot be paid.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CreditCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditErrorResponse'
        '502':
          $ref: '#/components/responses/CreditUpstreamFailure'
  /api/v1/checkout:
    post:
      tags:
      - Orders
      summary: Create an order and initialize checkout payment
      operationId: checkout
      description: >-
        A supplied coupon_code is matched exactly and its use is reserved
        atomically as part of checkout. A confirmed failure or cancellation
        releases that reservation. An uncertain payment outcome retains it
        while Core reconciles with the provider; unresolved outcomes require
        manual review. A timeout alone never releases a reservation. Coupon
        checkout requires X-Op-Key as its idempotency key, which identifies the
        checkout operation: retrying the same key and payload replays its order without reserving
        another use; reusing the key with a different payload conflicts.
      security:
      - BearerAuth: []
      parameters:
      - name: X-Op-Key
        in: header
        required: false
        description: Required when coupon_code is supplied; identifies the checkout operation for safe retries.
        schema:
          type: string
          minLength: 1
          maxLength: 512
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: Order and Mercado Pago checkout URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400':
          description: Request or shipping details are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '409':
          description: Current cart contents exceed available stock, the checkout key conflicts with a prior payload, or the original payment attempt still requires reconciliation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '422':
          description: Cart is empty, the order cannot be paid, or the coupon is ineligible; the response includes a reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '404':
          description: No coupon exists with the exact supplied code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '502':
          description: Core is unavailable or payment initialization failed.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/OrderErrorResponse'
        '503':
          description: Payments are not configured in Core.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
  /api/v1/checkout/confirm:
