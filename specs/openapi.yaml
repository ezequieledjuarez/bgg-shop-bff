openapi: 3.2.0
info:
  title: BGG Shop BFF API
  version: 1.0.0
  description: REST API exposed by the BFF for the board-game catalog, shopping cart,
    and purchase orders.
paths:
  /api/v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Register a customer account
      description: Creates a local customer account using email and password credentials.
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Customer account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Request body or registration data is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '409':
          description: An account with the email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '502':
          description: The BFF could not obtain a valid response from the Core GraphQL
            service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - {}
      - BearerAuth: []
      - XOpKey: []
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Authenticate a customer
      description: Authenticates a customer and merges any guest cart identified by
        the HttpOnly cart cookie.
      operationId: loginAccount
      parameters:
      - $ref: '#/components/parameters/GuestCartCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Customer authenticated successfully; the guest cart cookie
            is cleared after the Core merges it.
          headers:
            Set-Cookie:
              description: Clears the guest cart cookie after successful login.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '401':
          description: Email or password is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '502':
          description: The BFF could not obtain a valid response from the Core GraphQL
            service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - {}
      - BearerAuth: []
      - XOpKey: []
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh a customer access token
      description: >-
        Uses the refresh_token cookie or an optional request body token. A nonempty
        body token takes precedence. On success, a returned refresh token is rotated
        in an HttpOnly cookie and only the access token is returned in JSON.
      operationId: refreshAccessToken
      security:
      - {}
      parameters:
      - name: refresh_token
        in: cookie
        required: false
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshRequest'
      responses:
        '200':
          description: Access token refreshed; the refresh cookie is rotated when Core returns one.
          headers:
            Set-Cookie:
              description: Rotated HttpOnly refresh_token cookie when available.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRefreshResponse'
        '401':
          description: The refresh token is missing or rejected; the refresh cookie is cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRefreshErrorResponse'
        '502':
          description: Core is unavailable or returned an invalid response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRefreshErrorResponse'
  /api/v1/products:
    get:
      tags:
      - Products
      summary: List and filter board-game products
      description: Returns a paginated collection filtered by optional catalog criteria.
      operationId: listProducts
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/YearPublished'
      - $ref: '#/components/parameters/MinPlayers'
      - $ref: '#/components/parameters/MaxPlayers'
      - $ref: '#/components/parameters/CategoryId'
      - $ref: '#/components/parameters/PriceMin'
      - $ref: '#/components/parameters/PriceMax'
      responses:
        '200':
          description: Paginated product collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
              example:
                items:
                - bgg_id: 274364
                  name: Watergate
                  release_year: 2019
                  min_players: 2
                  max_players: 2
                  playing_time_minutes: 60
                  min_age: 12
                  weight: 2.25
                  category:
                  - Juegos de Estrategia
                  price: 90000.0
                  quantity: 10
                  publisher: Salt & Pepper Games
                  image_url: /media/portadas/2743640.webp
                page: 1
                page_size: 20
                total: 1
                total_pages: 1
        '400':
          description: The pagination or filter parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: page_size must not exceed 100
        '502':
          description: The BFF could not obtain a valid response from the Core GraphQL
            service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: upstream GraphQL request failed
                detail: GraphQL upstream returned errors
      security:
      - {}
      - BearerAuth: []
      - XOpKey: []
  /api/v1/cart:
    get:
      tags:
      - Cart
      summary: Read the current cart
      description: Reads the authenticated account cart when a Bearer token is provided;
        otherwise uses the opaque guest cart cookie.
      operationId: getCart
      parameters:
      - $ref: '#/components/parameters/GuestCartCookie'
      security:
      - {}
      - BearerAuth: []
      - XOpKey: []
      responses:
        '200':
          description: Current cart with current prices, available stock, and any
            cart warnings.
          headers:
            Set-Cookie:
              description: Sets or refreshes the HttpOnly guest cart cookie when the
                cart is anonymous.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
              example:
                lines:
                - bgg_id: 274364
                  name: Watergate
                  quantity: 2
                  available_stock: 10
                  unit_price: 90000.0
                  subtotal: 180000.0
                total: 180000.0
                warnings: []
        '502':
          description: The BFF could not obtain a valid response from Core GraphQL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/cart/items:
    post:
      tags:
      - Cart
      summary: Add a product to the cart
      operationId: addCartItem
      security:
      - {}
      - BearerAuth: []
      - XOpKey: []
      parameters:
      - $ref: '#/components/parameters/GuestCartCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemRequest'
      responses:
        '200':
          description: Product added and cart totals recalculated.
          headers:
            Set-Cookie:
              description: Sets or refreshes the HttpOnly guest cart cookie when the
                cart is anonymous.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: The product identifier or quantity is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The product does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '409':
          description: Requested quantity exceeds current stock; the existing cart
            is returned with a warning.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '502':
          description: The BFF could not obtain a valid response from Core GraphQL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/cart/items/{bgg_id}:
    patch:
      tags:
      - Cart
      summary: Set a cart item's quantity
      operationId: updateCartItemQuantity
      security:
      - {}
      - BearerAuth: []
      - XOpKey: []
      parameters:
      - $ref: '#/components/parameters/GuestCartCookie'
      - name: bgg_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartQuantityRequest'
      responses:
        '200':
          description: Quantity updated and cart totals recalculated.
          headers:
            Set-Cookie:
              description: Sets or refreshes the HttpOnly guest cart cookie when the
                cart is anonymous.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: The product identifier or quantity is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The product does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '409':
          description: Requested quantity exceeds current stock; the existing cart
            is returned with a warning.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '502':
          description: The BFF could not obtain a valid response from Core GraphQL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Cart
      summary: Remove a product from the cart
      operationId: removeCartItem
      security:
      - {}
      - BearerAuth: []
      - XOpKey: []
      parameters:
      - $ref: '#/components/parameters/GuestCartCookie'
      - name: bgg_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
      responses:
        '200':
          description: Product removed and cart totals recalculated.
          headers:
            Set-Cookie:
              description: Sets or refreshes the HttpOnly guest cart cookie when the
                cart is anonymous.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: The product identifier is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The BFF could not obtain a valid response from Core GraphQL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/games/{slug}:
    get:
      tags:
      - Games
      summary: Get a board-game detail by slug
      operationId: getGameDetail
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Product detail with approved reviews.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
              example:
                bgg_id: 274364
                name: Watergate
                release_year: 2019
                min_players: 2
                max_players: 2
                playing_time_minutes: 60
                min_age: 12
                weight: 2.25
                category:
                - Juegos de Estrategia
                price: 90000.0
                quantity: 10
                publisher: Salt & Pepper Games
                image_url: /media/portadas/2743640.webp
                review_summary:
                  approved_review_count: 0
                  average_rating: null
                approved_reviews: []
        '404':
          description: The game does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The Core GraphQL service is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - {}
      - BearerAuth: []
      - XOpKey: []
  /api/v1/games/{slug}/reviews:
    post:
      tags:
      - Reviews
      summary: Submit a board-game review
      operationId: createGameReview
      security:
      - BearerAuth: []
      - XOpKey: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Review created and awaiting moderation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReviewResponse'
        '400':
          description: Review data is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The game does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The user already reviewed this game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The BFF could not obtain a valid response from the Core GraphQL
            service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                errors:
                - code: UPSTREAM_ERROR
                  message: upstream GraphQL request failed
  /api/v1/wishlist:
    get:
      tags:
      - Wishlist
      summary: List the authenticated customer's wishlist
      operationId: listWishlist
      security:
      - BearerAuth: []
      - XOpKey: []
      responses:
        '200':
          description: Wishlist products owned by the authenticated customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistResponse'
              example:
                items:
                - bgg_id: 274364
                  name: Watergate
                  release_year: 2019
                  min_players: 2
                  max_players: 2
                  playing_time_minutes: 60
                  min_age: 12
                  weight: 2.25
                  category:
                  - Strategy
                  price: 90000.0
                  quantity: 10
                  publisher: Salt & Pepper Games
                  image_url: /media/portadas/2743640.webp
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '502':
          description: Core is unavailable or returned an invalid response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Wishlist
      summary: Add a product to the authenticated customer's wishlist
      operationId: addWishlistItem
      security:
      - BearerAuth: []
      - XOpKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WishlistAddRequest'
            example:
              bgg_id: 274364
      responses:
        '200':
          description: The added product, including the existing BFF product fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: The request body is invalid or the identifier is not a positive
            GraphQL Int.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '404':
          description: The product does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '502':
          description: Core is unavailable or returned an invalid response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/wishlist/{bgg_id}:
    delete:
      tags:
      - Wishlist
      summary: Remove a product from the authenticated customer's wishlist
      operationId: removeWishlistItem
      security:
      - BearerAuth: []
      - XOpKey: []
      parameters:
      - name: bgg_id
        in: path
        required: true
        description: Positive BoardGameGeek product identifier within GraphQL Int
          range.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
        example: 274364
      responses:
        '200':
          description: The removed product, including the existing BFF product fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: The identifier is not a positive GraphQL Int.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '404':
          description: The product does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '502':
          description: Core is unavailable or returned an invalid response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/credit:
    get:
      tags:
      - Credit
      summary: Read the authenticated buyer's available credit
      operationId: getCreditBalance
      description: >-
        Returns a balance of 0.00 ARS when no credit exists for the buyer.
        All error fields must be sanitized and must never contain gift card codes
        or bearer tokens.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Current available credit.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CreditCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditBalance'
        '401':
          $ref: '#/components/responses/CreditUnauthorized'
        '502':
          $ref: '#/components/responses/CreditUpstreamFailure'
  /api/v1/gift-cards/redeem:
    post:
      tags:
      - Credit
      summary: Redeem a gift card into the authenticated buyer's credit
      operationId: redeemGiftCard
      description: >-
        The card is consumed and its full value is credited atomically. Gift card
        codes and bearer tokens must not be logged. Codes must not be included in
        URLs or returned in responses. All error fields must be sanitized and must
        never contain gift card codes or bearer tokens.
        Invalid and already redeemed codes must produce indistinguishable errors.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CreditIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemGiftCardRequest'
      responses:
        '200':
          description: Balance snapshot at the time of redemption.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CreditCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditBalance'
        '400':
          $ref: '#/components/responses/CreditInvalidRequest'
        '401':
          $ref: '#/components/responses/CreditUnauthorized'
        '409':
          description: Sanitized error when the idempotency key was previously used for a different request.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CreditCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditErrorResponse'
        '422':
          description: Sanitized error when the card cannot be redeemed; invalid and used codes return the same error.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CreditCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditErrorResponse'
        '502':
          $ref: '#/components/responses/CreditUpstreamFailure'
  /api/v1/checkout/credit:
    post:
      tags:
      - Orders
      - Credit
      summary: Create and pay for an order using account credit
      operationId: checkoutWithCredit
      description: >-
        The authenticated buyer is determined from the bearer token and the server
        calculates the total. Order creation, credit debit, stock decrement, invoice
        creation, and purchased cart quantity updates are atomic. Insufficient credit
        or stock causes no partial changes. No payment provider is called.
        A pending Mercado Pago order owned by the buyer blocks a new credit checkout.
        After the pending order is resolved, start a new attempt with a new key.
        A 400 INVALID response is a local validation rejection and does not establish
        whether an earlier request with the key completed. If an earlier outcome is
        unknown, retry the original request with the same key. A 400
        ADDRESS_REQUIRED_RECORDED response is a Core rejection recorded against
        the key; retrying the same payload returns that rejection while its record
        is retained, and corrected input requires a new key during that period.
        The older ADDRESS_REQUIRED code is ambiguous
        and does not confirm whether the key was recorded.
        All error fields must be sanitized and must never contain gift card codes
        or bearer tokens.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CreditIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: Paid order and balance snapshot at the time of purchase.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CreditCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCheckoutResponse'
        '400':
          $ref: '#/components/responses/CreditInvalidRequest'
        '401':
          $ref: '#/components/responses/CreditUnauthorized'
        '409':
          description: Sanitized error for insufficient credit or stock, a pending payment (PENDING_PAYMENT), or an idempotency key conflict.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CreditCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditErrorResponse'
        '422':
          description: Sanitized error when the cart is empty or the order cannot be paid.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CreditCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditErrorResponse'
        '502':
          $ref: '#/components/responses/CreditUpstreamFailure'
  /api/v1/checkout:
    post:
      tags:
      - Orders
      summary: Create an order and initialize checkout payment
      operationId: checkout
      security:
      - BearerAuth: []
      - XOpKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: Order and Mercado Pago checkout URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400':
          description: Request or shipping details are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '409':
          description: Current cart contents exceed available stock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '422':
          description: Cart is empty or the order cannot be paid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '502':
          description: Core is unavailable or payment initialization failed.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/OrderErrorResponse'
        '503':
          description: Payments are not configured in Core.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
  /api/v1/checkout/confirm:
    post:
      tags:
      - Orders
      summary: Confirm payment with Core and return the order
      operationId: confirmCheckoutPayment
      security:
      - BearerAuth: []
      - XOpKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentRequest'
      responses:
        '200':
          description: Confirmed, pending, or rejected payment state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Request or payment identifier is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '404':
          description: The order does not exist or is not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '409':
          description: An approved payment requires manual review (PAYMENT_REQUIRES_REVIEW); no automatic refund is performed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '422':
          description: Core could not verify this payment for the order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '502':
          description: Core is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/orders:
    get:
      tags:
      - Orders
      summary: List the authenticated customer's orders
      operationId: listOrders
      security:
      - BearerAuth: []
      - XOpKey: []
      responses:
        '200':
          description: Orders belonging to the authenticated customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '502':
          description: Core is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/orders/{order_id}:
    get:
      tags:
      - Orders
      summary: Get an owned order with lines and payment details
      operationId: getOrder
      security:
      - BearerAuth: []
      - XOpKey: []
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Order detail including shipping, invoice metadata, and rejection
            reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: The order identifier is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '404':
          description: The order does not exist or is not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '502':
          description: Core is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/orders/{order_id}/retry-payment:
    post:
      tags:
      - Orders
      summary: Initialize a new payment attempt for an eligible order
      operationId: retryOrderPayment
      description: >-
        Rejected or pending orders can be retried when they have no unresolved
        payment attempt, unreleased payment review, or credit retry guard. An unresolved
        attempt returns PENDING_PAYMENT. An unreleased payment review returns
        PAYMENT_REQUIRES_REVIEW and does not unblock automatically.
      security:
      - BearerAuth: []
      - XOpKey: []
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Order and new checkout URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400':
          description: The order identifier is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '404':
          description: The order does not exist or is not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '409':
          description: A payment attempt requires reconciliation (PENDING_PAYMENT), or a payment requires manual review (PAYMENT_REQUIRES_REVIEW).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '422':
          description: The order cannot be paid again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '502':
          description: Core is unavailable or payment initialization failed.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/OrderErrorResponse'
        '503':
          description: Payments are not configured in Core.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
  /api/v1/orders/{order_id}/invoice:
    get:
      tags:
      - Orders
      summary: Download the authenticated customer's invoice PDF
      operationId: downloadOrderInvoice
      security:
      - BearerAuth: []
      - XOpKey: []
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Invoice PDF streamed from Core.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: The order identifier is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '404':
          description: No invoice is available for this owned order.
        '502':
          description: Core is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/gift-cards:
    post:
      tags:
      - Administration
      summary: Issue a single-use gift card
      description: >-
        Creates a card for an administrator and returns its code only once.
        The code must not be logged or cached. Repeated requests create separate cards.
        All error fields must be sanitized and must never contain gift card codes
        or bearer tokens.
      operationId: adminCreateGiftCard
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminGiftCardCreateRequest'
      responses:
        '201':
          description: Gift card issued; the code is returned only once.
          headers:
            Cache-Control:
              required: true
              description: Prevents the response containing the card code from being cached.
              schema:
                type: string
                enum:
                - no-store
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGiftCardCreateResponse'
        '400':
          description: Invalid amount or request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Administrator permission required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Core unavailable or invalid response; issuance outcome may be unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    XOpKey:
      type: apiKey
      in: header
      name: X-Op-Key
      description: Operations key for privileged internal operations (one-time raw
        key shown at creation).
  parameters:
    CreditIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated UUID scoped to the authenticated buyer and operation.
        A repeated request with the same key and payload returns the original
        successful response snapshot without repeating effects, with no expiration.
        Core retains recorded rejections for 30 days; after expiration the key may
        be processed as a new request. A different payload reaching Core's
        idempotency check while a record exists returns 409. Validation
        in the BFF or Core may reject a request before that check. If the outcome is unknown after an upstream
        failure, retry the same request with the same key. Never persist raw card codes.
      schema:
        type: string
        format: uuid
    GuestCartCookie:
      name: cart_id
      in: cookie
      required: false
      description: Opaque guest cart identifier issued by the BFF in an HttpOnly,
        SameSite=Lax cookie. The default name is cart_id and can be changed with CART_COOKIE_NAME.
        Secure defaults on outside debug/development and is configurable with CART_COOKIE_SECURE.
        This is not a user identifier; Core selects authenticated carts from the Bearer
        token.
      schema:
        type: string
    Search:
      name: search
      in: query
      required: false
      description: Case-insensitive search over product name or publisher.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    YearPublished:
      name: year_published
      in: query
      required: false
      description: Exact publication year.
      schema:
        type: integer
        minimum: 0
        maximum: 9999
    MinPlayers:
      name: min_players
      in: query
      required: false
      description: Minimum requested player count.
      schema:
        type: integer
        minimum: 1
        maximum: 999
    MaxPlayers:
      name: max_players
      in: query
      required: false
      description: Maximum requested player count.
      schema:
        type: integer
        minimum: 1
        maximum: 999
    CategoryId:
      name: category_id
      in: query
      required: false
      description: Category identifier (1 strategy, 2 thematic, 3 family).
      schema:
        type: integer
        minimum: 1
    PriceMin:
      name: price_min
      in: query
      required: false
      description: Inclusive minimum price.
      schema:
        type: number
        format: double
        minimum: 0
    PriceMax:
      name: price_max
      in: query
      required: false
      description: Inclusive maximum price.
      schema:
        type: number
        format: double
        minimum: 0
    Page:
      name: page
      in: query
      required: false
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: Number of products per page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      example: 50
  headers:
    CreditCacheControl:
      required: true
      description: Prevents credit responses from being cached.
      schema:
        type: string
        enum:
        - no-store
  responses:
    CreditInvalidRequest:
      description: Sanitized error for an invalid request body or idempotency key.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CreditCacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreditErrorResponse'
    CreditUnauthorized:
      description: Sanitized error for a missing or invalid bearer token.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CreditCacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreditErrorResponse'
    CreditUpstreamFailure:
      description: >-
        Core is unavailable or returned an invalid response. For POST requests the
        outcome may be unknown; retry the same request with the same idempotency key.
        The response must not include upstream information, gift card codes, or tokens.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CreditCacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreditUpstreamError'
  schemas:
    AuthRefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          writeOnly: true
    AuthRefreshResponse:
      type: object
      required:
      - access_token
      properties:
        access_token:
          type: string
    AuthRefreshErrorResponse:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
    CreditErrorResponse:
      type: object
      additionalProperties: false
      description: >-
        All error fields must be sanitized and must never contain gift card codes
        or bearer tokens.
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - code
            - message
            properties:
              code:
                type: string
              message:
                type: string
                description: Sanitized public error message.
              field:
                type:
                - array
                - 'null'
                items:
                  type: string
    CreditUpstreamError:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: string
          enum:
          - Credit service unavailable
    CreditBalance:
      type: object
      additionalProperties: false
      required:
      - balance
      - currency
      properties:
        balance:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
          description: Available balance as a decimal string with two fractional digits.
          example: '20000.00'
        currency:
          type: string
          enum:
          - ARS
    RedeemGiftCardRequest:
      type: object
      additionalProperties: false
      required:
      - code
      properties:
        code:
          type: string
          writeOnly: true
          description: Sensitive single-use gift card code.
    CreditCheckoutResponse:
      type: object
      additionalProperties: false
      required:
      - order
      - credit
      properties:
        order:
          allOf:
          - $ref: '#/components/schemas/PurchaseOrder'
          - type: object
            required:
            - status
            - invoice
            properties:
              status:
                type: string
                enum:
                - paid
              invoice:
                $ref: '#/components/schemas/Invoice'
        credit:
          $ref: '#/components/schemas/CreditBalance'
    AdminGiftCardCreateRequest:
      type: object
      additionalProperties: false
      required:
      - amount
      properties:
        amount:
          type: string
          pattern: '^[0-9]{1,10}(\.[0-9]{1,2})?$'
          description: Positive amount in ARS, with up to two decimal places.
          example: '20000.00'
    AdminGiftCardCreateResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - code
      - amount
      - currency
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Sensitive redemption code returned only once.
        amount:
          type: string
          example: '20000.00'
        currency:
          type: string
          enum:
          - ARS
    CartItemRequest:
      type: object
      required:
      - bgg_id
      - quantity
      properties:
        bgg_id:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: BoardGameGeek product identifier.
        quantity:
          type: integer
          minimum: 1
          maximum: 2147483647
    CartQuantityRequest:
      type: object
      required:
      - quantity
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 2147483647
    CartLine:
      type: object
      required:
      - bgg_id
      - name
      - quantity
      - available_stock
      - unit_price
      - subtotal
      properties:
        bgg_id:
          type: integer
          minimum: 1
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        available_stock:
          type: integer
          minimum: 0
          description: Current product inventory; cart edits do not reserve stock.
        unit_price:
          type: number
          format: double
        subtotal:
          type: number
          format: double
    CartWarning:
      type: object
      required:
      - code
      - message
      properties:
        field:
          type: array
          nullable: true
          items:
            type: string
        code:
          type: string
          example: INSUFFICIENT_STOCK
        message:
          type: string
    CartResponse:
      type: object
      required:
      - lines
      - total
      - warnings
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CartLine'
        total:
          type: number
          format: double
        warnings:
          type: array
          description: Core cart userErrors, including stock-limit feedback.
          items:
            $ref: '#/components/schemas/CartWarning'
    CreateReviewRequest:
      type: object
      required:
      - rating
      - body
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        body:
          type: string
          minLength: 1
          maxLength: 2000
    CreateReviewResponse:
      type: object
      required:
      - created
      - status
      - created_at
      properties:
        created:
          type: boolean
        status:
          type: string
          enum:
          - PENDING
        created_at:
          type: string
          format: date-time
    ReviewSummary:
      type: object
      required:
      - approved_review_count
      properties:
        approved_review_count:
          type: integer
          minimum: 0
        average_rating:
          type: number
          format: double
          nullable: true
    ApprovedReview:
      type: object
      required:
      - rating
      - body
      - created_at
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        body:
          type: string
        created_at:
          type: string
          format: date-time
    ProductDetail:
      type: object
      required:
      - bgg_id
      - name
      - release_year
      - min_players
      - max_players
      - playing_time_minutes
      - min_age
      - weight
      - category
      - price
      - publisher
      - image_url
      - quantity
      - review_summary
      - approved_reviews
      properties:
        bgg_id:
          type: integer
          minimum: 1
          description: Public BoardGameGeek product identifier.
          example: 274364
        name:
          type: string
        release_year:
          type: integer
        min_players:
          type: integer
        max_players:
          type: integer
        playing_time_minutes:
          type: integer
        min_age:
          type: integer
        weight:
          type: number
        category:
          type: array
          items:
            type: string
        price:
          type: number
        publisher:
          type: string
        image_url:
          type: string
        quantity:
          type: integer
          minimum: 0
          description: Current inventory available for this product.
          example: 10
        review_summary:
          $ref: '#/components/schemas/ReviewSummary'
        approved_reviews:
          type: array
          items:
            $ref: '#/components/schemas/ApprovedReview'
    RegisterRequest:
      type: object
      required:
      - email
      - password
      - first_name
      - last_name
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
        first_name:
          type: string
          minLength: 1
          maxLength: 150
        last_name:
          type: string
          minLength: 1
          maxLength: 150
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
    AuthUser:
      type: object
      required:
      - id
      - email
      - first_name
      - last_name
      - is_active
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        is_active:
          type: boolean
    AuthSession:
      type: object
      required:
      - access_token
      - refresh_token
      properties:
        access_token:
          type: string
          description: JWT access token for Bearer authentication.
        refresh_token:
          type: string
          nullable: true
        csrf_token:
          type: string
          nullable: true
    AuthError:
      type: object
      required:
      - message
      properties:
        field:
          type: array
          nullable: true
          items:
            type: string
        code:
          type: string
          nullable: true
        message:
          type: string
    AuthErrorResponse:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/AuthError'
    RegisterResponse:
      type: object
      required:
      - user
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        session:
          $ref: '#/components/schemas/AuthSession'
          nullable: true
    LoginResponse:
      type: object
      required:
      - user
      - session
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        session:
          $ref: '#/components/schemas/AuthSession'
    Product:
      type: object
      required:
      - bgg_id
      - name
      - release_year
      - min_players
      - max_players
      - playing_time_minutes
      - min_age
      - weight
      - category
      - price
      - publisher
      - image_url
      - quantity
      properties:
        bgg_id:
          type: integer
          description: BoardGameGeek identifier.
          example: 274364
        name:
          type: string
          example: Watergate
        release_year:
          type: integer
          example: 2019
        min_players:
          type: integer
          example: 2
        max_players:
          type: integer
          example: 2
        playing_time_minutes:
          type: integer
          example: 60
        min_age:
          type: integer
          example: 12
        weight:
          type: number
          format: double
          example: 2.25
        category:
          type: array
          items:
            type: string
          example:
          - Juegos de Estrategia
        price:
          type: number
          format: double
          example: 90000.0
        publisher:
          type: string
          example: Salt & Pepper Games
        image_url:
          type: string
          example: /media/portadas/2743640.webp
        quantity:
          type: integer
          minimum: 0
          description: Current inventory available for this product.
          example: 10
    WishlistAddRequest:
      type: object
      additionalProperties: false
      required:
      - bgg_id
      properties:
        bgg_id:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Product identifier. User identity is derived exclusively from
            the bearer token.
          example: 274364
    WishlistResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    ProductPage:
      type: object
      required:
      - items
      - page
      - page_size
      - total
      - total_pages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
          minimum: 1
          example: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        total:
          type: integer
          minimum: 0
          example: 1
        total_pages:
          type: integer
          minimum: 0
          example: 1
    CheckoutRequest:
      type: object
      additionalProperties: false
      required:
      - shipping_mode
      properties:
        shipping_mode:
          type: string
          enum:
          - standard
          - pickup
        address:
          $ref: '#/components/schemas/ShippingAddress'
    ShippingAddress:
      type: object
      additionalProperties: false
      description: >-
        Limits apply to the supplied strings before trimming. Mercado Pago
        checkout trims the fields; credit checkout preserves the submitted
        values for idempotency. For standard delivery, recipient, street, city,
        and postal code must contain non-whitespace characters. Explicit null
        values are not accepted.
      properties:
        recipient:
          type: string
          maxLength: 250
        street:
          type: string
          maxLength: 500
        city:
          type: string
          maxLength: 150
        postal_code:
          type: string
          maxLength: 32
        phone:
          type: string
          maxLength: 50
    ConfirmPaymentRequest:
      type: object
      additionalProperties: false
      required:
      - order_id
      - payment_id
      properties:
        order_id:
          type: string
          format: uuid
        payment_id:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9._-]+$
          - type: integer
            minimum: 0
    CheckoutResponse:
      type: object
      required:
      - order
      - init_point
      properties:
        order:
          $ref: '#/components/schemas/PurchaseOrder'
        init_point:
          type: string
          format: uri
    OrderResponse:
      type: object
      required:
      - order
      properties:
        order:
          $ref: '#/components/schemas/PurchaseOrder'
    OrderListResponse:
      type: object
      required:
      - orders
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrder'
    PurchaseOrder:
      type: object
      required:
      - id
      - status
      - total
      - currency
      - shipping_mode
      - created_at
      - lines
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        total:
          type: number
          format: float
        currency:
          type: string
        shipping_mode:
          type: string
          enum:
          - standard
          - pickup
        recipient:
          type: string
          nullable: true
        street:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        payment_status:
          type: string
          nullable: true
        payment_status_detail:
          type: string
          nullable: true
          description: Payment provider detail, including rejection reason.
        created_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time
          nullable: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderLine'
        invoice:
          allOf:
          - $ref: '#/components/schemas/Invoice'
          nullable: true
    PurchaseOrderLine:
      type: object
      required:
      - bgg_id
      - name
      - unit_price
      - quantity
      - subtotal
      properties:
        bgg_id:
          type: integer
        name:
          type: string
        unit_price:
          type: number
          format: float
        quantity:
          type: integer
        subtotal:
          type: number
          format: float
    Invoice:
      type: object
      required:
      - number
      - issued_at
      - total
      properties:
        number:
          type: integer
          format: int64
        issued_at:
          type: string
          format: date-time
        total:
          type: number
          format: float
    OrderErrorResponse:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
              message:
                type: string
              field:
                type: array
                nullable: true
                items:
                  type: string
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          description: Stable high-level error message.
          example: upstream GraphQL request failed
        detail:
          type: string
          description: Optional diagnostic detail.
          example: GraphQL upstream returned errors
