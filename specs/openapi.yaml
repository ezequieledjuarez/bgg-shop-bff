        number:
          type: integer
          format: int64
        issued_at:
          type: string
          format: date-time
        total:
          type: number
          format: float
    OrderErrorResponse:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
              message:
                type: string
              field:
                type: array
                nullable: true
                items:
                  type: string
    ChatMessageRequest:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: >-
            Shop-related buyer question only. Personal, account, order, and
            transactional details are rejected before retrieval or forwarding.
    ChatSource:
      type: object
      additionalProperties: false
      required:
      - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        url:
          type: string
          format: uri
          maxLength: 2048
    ChatMessage:
      type: object
      additionalProperties: false
      required:
      - id
      - role
      - content
      - created_at
      - sources
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        role:
          type: string
          enum:
          - user
          - assistant
        content:
          type: string
          description: >-
            Persisted in-scope conversation text only. Unsafe/out-of-scope
            submissions are not persisted or echoed.
        created_at:
          type: string
          format: date-time
        sources:
          type: array
          items:
            $ref: '#/components/schemas/ChatSource'
    ChatConversation:
      type: object
      additionalProperties: false
      required:
      - id
      - created_at
      - updated_at
      - expires_at
      - messages
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: Time of the most recent persisted activity.
        expires_at:
          type: string
          format: date-time
          description: 30 days after the most recent activity.
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
    ChatConversationResponse:
      type: object
      additionalProperties: false
      required:
      - conversation
      properties:
        conversation:
          $ref: '#/components/schemas/ChatConversation'
    ChatReplyResponse:
      type: object
      additionalProperties: false
      required:
      - conversation_id
      - answer
      - sources
      - recommendations
      - created_at
      properties:
        conversation_id:
          type: string
          minLength: 1
          maxLength: 128
        answer:
          type: string
          description: >-
            Grounded answer, refusal, clarification, or uncertainty fallback.
            English and Spanish are supported, and assistant text matches the
            language of the submitted question. It must not repeat protected
            details from the submitted message.
        sources:
          type: array
          description: Approved knowledge sources used for this answer, when available.
          items:
            $ref: '#/components/schemas/ChatSource'
        recommendations:
          type: array
          description: >-
            Current catalog products returned by Core for this request only.
            Product facts must not be inferred or fabricated.
          items:
            $ref: '#/components/schemas/Product'
        created_at:
          type: string
          format: date-time
    ChatErrorResponse:
      type: object
      additionalProperties: false
      required:
      - code
      - error
      properties:
        code:
          type: string
          enum:
          - INVALID_REQUEST
          - UNAUTHENTICATED
          - NOT_FOUND
          - RATE_LIMITED
          - SERVICE_UNAVAILABLE
        error:
          type: string
          description: Stable sanitized public message; never contains submitted text or upstream details.
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          description: Stable high-level error message.
          example: upstream GraphQL request failed
        detail:
          type: string
          description: Optional diagnostic detail.
          example: GraphQL upstream returned errors
