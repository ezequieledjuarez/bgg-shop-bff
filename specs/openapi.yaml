    ProductPublisherFacet:
      type: object
      additionalProperties: false
      required:
      - publisher
      - product_count
      properties:
        publisher:
          type: string
          minLength: 1
          maxLength: 250
          description: Trimmed, case-sensitive publisher identity and display name.
        product_count:
          type: integer
          minimum: 0
          description: Count of distinct eligible public catalog games.
    CheckoutRequest:
      type: object
      additionalProperties: false
      required:
      - shipping_mode
      properties:
        shipping_mode:
          type: string
          enum:
          - standard
          - pickup
        address:
          $ref: '#/components/schemas/ShippingAddress'
        coupon_code:
          type: string
          minLength: 1
          description: >-
            Optional exact, case-sensitive coupon code. When present, X-Op-Key
            is required and identifies this checkout operation. A supplied
            coupon is reserved atomically only when its saving is selected;
            preview does not reserve it.
    ShippingAddress:
      type: object
      additionalProperties: false
      description: >-
        Limits apply to the supplied strings before trimming. Mercado Pago
        checkout trims the fields; credit checkout preserves the submitted
        values for idempotency. For standard delivery, recipient, street, city,
        and postal code must contain non-whitespace characters. Explicit null
        values are not accepted.
      properties:
        recipient:
          type: string
          maxLength: 250
        street:
          type: string
          maxLength: 500
        city:
          type: string
          maxLength: 150
        postal_code:
          type: string
          maxLength: 32
        phone:
          type: string
          maxLength: 50
    ConfirmPaymentRequest:
      type: object
      additionalProperties: false
      required:
      - order_id
      - payment_id
      properties:
        order_id:
          type: string
          format: uuid
        payment_id:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9._-]+$
          - type: integer
            minimum: 0
    CheckoutResponse:
      type: object
      required:
      - order
      - init_point
      properties:
        order:
          $ref: '#/components/schemas/PurchaseOrder'
        init_point:
          type: string
          format: uri
    OrderResponse:
      type: object
      required:
      - order
      properties:
        order:
          $ref: '#/components/schemas/PurchaseOrder'
    OrderListResponse:
      type: object
      required:
      - orders
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrder'
    PurchaseOrder:
      type: object
      required:
      - id
      - status
      - total
      - currency
      - shipping_mode
      - created_at
      - lines
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        total:
          type: number
          format: float
        currency:
          type: string
        shipping_mode:
          type: string
          enum:
          - standard
          - pickup
        recipient:
          type: string
        street:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        payment_status:
          type: string
          nullable: true
        payment_status_detail:
          type: string
          nullable: true
          description: Payment provider detail, including rejection reason.
        created_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time
          nullable: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderLine'
        invoice:
          allOf:
          - $ref: '#/components/schemas/Invoice'
          nullable: true
    PurchaseOrderLine:
      type: object
      required:
      - bgg_id
      - name
      - unit_price
      - quantity
      - subtotal
      properties:
        bgg_id:
          type: integer
        name:
          type: string
        unit_price:
          type: number
          format: float
        quantity:
          type: integer
        subtotal:
          type: number
          format: float
    Invoice:
      type: object
