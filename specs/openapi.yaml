openapi: 3.2.0
info:
  title: BGG Shop BFF API
  version: 1.0.0
  description: REST API exposed by the BFF for the board-game catalog, shopping cart,
    and purchase orders. Administrative operations require an active authenticated
    user with is_staff or is_superuser; an operation key alone does not grant admin
    access. These contracts do not establish runtime conformance.
paths:
  /internal/v1/catalog-events:
    post:
      tags:
      - Internal Events
      summary: Invalidate public catalog caches from Core
      description: >-
        Accepts a minimal versioned catalog event authenticated by an HMAC-SHA256
        signature over the exact request body. This internal endpoint does not
        accept product, customer, or payment payloads.
      operationId: receiveCatalogEvent
      parameters:
      - name: X-Catalog-Event-Signature
        in: header
        required: true
        description: HMAC-SHA256 of the exact request body, prefixed with sha256=.
        schema:
          type: string
          pattern: '^sha256=[0-9a-f]{64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogEvent'
      responses:
        '204':
          description: Event accepted and public catalog cache generation advanced.
        '400':
          description: Event envelope is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Signature is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Shared-secret configuration or cache invalidation is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Register a customer account
      description: Creates a local customer account using email and password credentials.
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Customer account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Request body or registration data is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '409':
          description: An account with the email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '502':
          description: The BFF could not obtain a valid response from the Core GraphQL
            service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - {}
      - BearerAuth: []
      - XOpKey: []
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Authenticate a customer
      description: Authenticates a customer and merges any guest cart identified by
        the HttpOnly cart cookie.
      operationId: loginAccount
      parameters:
      - $ref: '#/components/parameters/GuestCartCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Customer authenticated successfully; the guest cart cookie
            is cleared after the Core merges it.
          headers:
            Cache-Control:
              required: true
              description: Prevents caching of session credentials.
              schema:
                type: string
                enum:
                - no-store
            Set-Cookie:
              description: Clears the guest cart cookie after successful login.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '401':
          description: Email or password is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '502':
          description: The BFF could not obtain a valid response from the Core GraphQL
            service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - {}
      - BearerAuth: []
      - XOpKey: []
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      summary: End the local session and revoke an optional operation key
      description: >-
        When X-Op-Key is supplied, revokes that key in Core. Without a key,
        clears the refresh cookie. Existing JWT access tokens are not revoked.
      operationId: logoutAccount
      security:
      - {}
      parameters:
      - name: X-Op-Key
        in: header
        required: false
        schema:
          type: string
      responses:
        '204':
          description: The key is revoked or no key was supplied; the refresh cookie is cleared.
        '502':
          description: The BFF could not confirm operation-key revocation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh a customer access token
      description: >-
        Uses the refresh_token cookie or an optional request body token. A nonempty
        body token takes precedence. On success, a returned refresh token is rotated
        in an HttpOnly cookie and only the access token is returned in JSON.
      operationId: refreshAccessToken
      security:
      - {}
      parameters:
      - name: refresh_token
        in: cookie
        required: false
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshRequest'
      responses:
        '200':
          description: Access token refreshed; the refresh cookie is rotated when Core returns one.
          headers:
            Set-Cookie:
              description: Rotated HttpOnly refresh_token cookie when available.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRefreshResponse'
        '401':
          description: The refresh token is missing or rejected; the refresh cookie is cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRefreshErrorResponse'
        '502':
          description: Core is unavailable or returned an invalid response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRefreshErrorResponse'
  /api/v1/product-categories:
    get:
      tags:
      - Products
      summary: List available product category names
      operationId: listProductCategories
      responses:
        '200':
          description: Distinct category names from the catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '502':
          description: Core is unavailable or returned an invalid response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/products:
    get:
      tags:
      - Products
      summary: List and filter board-game products
      description: Returns a paginated collection filtered by optional catalog criteria.
      operationId: listProducts
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/YearPublished'
      - $ref: '#/components/parameters/MinPlayers'
      - $ref: '#/components/parameters/MaxPlayers'
      - $ref: '#/components/parameters/CategoryId'
      - $ref: '#/components/parameters/CategoryName'
      - $ref: '#/components/parameters/PriceMin'
      - $ref: '#/components/parameters/PriceMax'
      responses:
        '200':
          description: Paginated product collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
              example:
                items:
                - bgg_id: 274364
                  name: Watergate
                  release_year: 2019
                  min_players: 2
                  max_players: 2
                  playing_time_minutes: 60
                  min_age: 12
                  weight: 2.25
                  category:
                  - Juegos de Estrategia
                  price: 90000.0
                  quantity: 10
                  publisher: Salt & Pepper Games
                  image_url: /media/portadas/2743640.webp
                page: 1
                page_size: 20
                total: 1
                total_pages: 1
        '400':
          description: The pagination or filter parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: page_size must not exceed 100
        '502':
          description: The BFF could not obtain a valid response from the Core GraphQL
            service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: upstream GraphQL request failed
                detail: GraphQL upstream returned errors
      security:
      - {}
      - BearerAuth: []
      - XOpKey: []
  /api/v1/coupons:
    get:
      tags:
      - Coupons
      summary: List available coupons
      description: >-
        Lists active coupons with remaining uses and configured validity dates
        containing the current time. This public read does not consume or
        reserve coupon uses. It does not guarantee availability at payment.
      operationId: listAvailableCoupons
      security:
      - {}
      responses:
        '200':
          description: Available coupons.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [code, starts_at, ends_at]
                  properties:
                    code:
                      type: string
                    starts_at:
                      type: string
                      format: date-time
                    ends_at:
                      type: string
                      format: date-time
        '502':
          description: The coupon service could not be reached or returned invalid data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/cart:
    get:
      tags:
      - Cart
      summary: Read the current cart
      description: Reads the authenticated account cart when a Bearer token is provided;
        otherwise uses the opaque guest cart cookie.
      operationId: getCart
      parameters:
      - $ref: '#/components/parameters/GuestCartCookie'
      security:
      - {}
      - BearerAuth: []
      - XOpKey: []
      responses:
        '200':
          description: Current cart with current prices, available stock, and any
            cart warnings.
          headers:
            Set-Cookie:
              description: Sets or refreshes the HttpOnly guest cart cookie when the
                cart is anonymous.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
              example:
                lines:
                - bgg_id: 274364
                  name: Watergate
                  quantity: 2
                  available_stock: 10
                  unit_price: 90000.0
                  subtotal: 180000.0
                total: 180000.0
                warnings: []
        '502':
          description: The BFF could not obtain a valid response from Core GraphQL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/cart/items:
    post:
      tags:
      - Cart
      summary: Add a product to the cart
      operationId: addCartItem
      security:
      - {}
      - BearerAuth: []
      - XOpKey: []
      parameters:
      - $ref: '#/components/parameters/GuestCartCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemRequest'
      responses:
        '200':
          description: Product added and cart totals recalculated.
          headers:
            Set-Cookie:
              description: Sets or refreshes the HttpOnly guest cart cookie when the
                cart is anonymous.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: The product identifier or quantity is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The product does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '409':
          description: Requested quantity exceeds current stock; the existing cart
            is returned with a warning.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '502':
          description: The BFF could not obtain a valid response from Core GraphQL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/cart/items/{bgg_id}:
    patch:
      tags:
      - Cart
      summary: Set a cart item's quantity
      operationId: updateCartItemQuantity
      security:
      - {}
      - BearerAuth: []
      - XOpKey: []
      parameters:
      - $ref: '#/components/parameters/GuestCartCookie'
      - name: bgg_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartQuantityRequest'
      responses:
        '200':
          description: Quantity updated and cart totals recalculated.
          headers:
            Set-Cookie:
              description: Sets or refreshes the HttpOnly guest cart cookie when the
                cart is anonymous.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: The product identifier or quantity is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The product does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '409':
          description: Requested quantity exceeds current stock; the existing cart
            is returned with a warning.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '502':
          description: The BFF could not obtain a valid response from Core GraphQL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Cart
      summary: Remove a product from the cart
      operationId: removeCartItem
      security:
      - {}
      - BearerAuth: []
      - XOpKey: []
      parameters:
      - $ref: '#/components/parameters/GuestCartCookie'
      - name: bgg_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
      responses:
        '200':
          description: Product removed and cart totals recalculated.
          headers:
            Set-Cookie:
              description: Sets or refreshes the HttpOnly guest cart cookie when the
                cart is anonymous.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: The product identifier is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The BFF could not obtain a valid response from Core GraphQL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/games/{slug}:
    get:
      tags:
      - Games
      summary: Get a board-game detail by slug
      operationId: getGameDetail
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Product detail with approved reviews.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
              example:
                bgg_id: 274364
                name: Watergate
                release_year: 2019
                min_players: 2
                max_players: 2
                playing_time_minutes: 60
                min_age: 12
                weight: 2.25
                category:
                - Juegos de Estrategia
                price: 90000.0
                quantity: 10
                publisher: Salt & Pepper Games
                image_url: /media/portadas/2743640.webp
                review_summary:
                  approved_review_count: 0
                  average_rating: null
                approved_reviews: []
        '404':
          description: The game does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The Core GraphQL service is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - {}
      - BearerAuth: []
      - XOpKey: []
  /api/v1/games/{slug}/reviews:
    post:
      tags:
      - Reviews
      summary: Submit a board-game review
      operationId: createGameReview
      security:
      - BearerAuth: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Review created and awaiting moderation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReviewResponse'
        '400':
          description: Review data is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewErrorResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewErrorResponse'
        '404':
          description: The game does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewErrorResponse'
        '409':
          description: The user already reviewed this game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewErrorResponse'
        '502':
          description: The BFF could not obtain a valid response from the Core GraphQL
            service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewErrorResponse'
              example:
                errors:
                - code: UPSTREAM_ERROR
                  message: upstream GraphQL request failed
  /api/v1/wishlist:
    get:
      tags:
      - Wishlist
      summary: List the authenticated customer's wishlist
      operationId: listWishlist
      security:
      - BearerAuth: []
      - XOpKey: []
      responses:
        '200':
          description: Wishlist products owned by the authenticated customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistResponse'
              example:
                items:
                - bgg_id: 274364
                  name: Watergate
                  release_year: 2019
                  min_players: 2
                  max_players: 2
                  playing_time_minutes: 60
                  min_age: 12
                  weight: 2.25
                  category:
                  - Strategy
                  price: 90000.0
                  quantity: 10
                  publisher: Salt & Pepper Games
                  image_url: /media/portadas/2743640.webp
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '502':
          description: Core is unavailable or returned an invalid response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Wishlist
      summary: Add a product to the authenticated customer's wishlist
      operationId: addWishlistItem
      security:
      - BearerAuth: []
      - XOpKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WishlistAddRequest'
            example:
              bgg_id: 274364
      responses:
        '200':
          description: The added product, including the existing BFF product fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: The request body is invalid or the identifier is not a positive
            GraphQL Int.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '404':
          description: The product does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '502':
          description: Core is unavailable or returned an invalid response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/wishlist/{bgg_id}:
    delete:
      tags:
      - Wishlist
      summary: Remove a product from the authenticated customer's wishlist
      operationId: removeWishlistItem
      security:
      - BearerAuth: []
      - XOpKey: []
      parameters:
      - name: bgg_id
        in: path
        required: true
        description: Positive BoardGameGeek product identifier within GraphQL Int
          range.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
        example: 274364
      responses:
        '200':
          description: The removed product, including the existing BFF product fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: The identifier is not a positive GraphQL Int.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '404':
          description: The product does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '502':
          description: Core is unavailable or returned an invalid response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/credit:
    get:
      tags:
      - Credit
      summary: Read the authenticated buyer's available credit
      operationId: getCreditBalance
      description: >-
        Returns a balance of 0.00 ARS when no credit exists for the buyer.
        All error fields must be sanitized and must never contain gift card codes
        or bearer tokens.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Current available credit.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CreditCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditBalance'
        '401':
          $ref: '#/components/responses/CreditUnauthorized'
        '502':
          $ref: '#/components/responses/CreditUpstreamFailure'
  /api/v1/gift-cards/redeem:
    post:
      tags:
      - Credit
      summary: Redeem a gift card into the authenticated buyer's credit
      operationId: redeemGiftCard
      description: >-
        The card is consumed and its full value is credited atomically. Gift card
        codes and bearer tokens must not be logged. Codes must not be included in
        URLs or returned in responses. All error fields must be sanitized and must
        never contain gift card codes or bearer tokens.
        Invalid and already redeemed codes must produce indistinguishable errors.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CreditIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemGiftCardRequest'
      responses:
        '200':
          description: Balance snapshot at the time of redemption.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CreditCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditBalance'
        '400':
          $ref: '#/components/responses/CreditInvalidRequest'
        '401':
          $ref: '#/components/responses/CreditUnauthorized'
        '409':
          description: Sanitized error when the idempotency key was previously used for a different request.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CreditCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditErrorResponse'
        '422':
          description: Sanitized error when the card cannot be redeemed; invalid and used codes return the same error.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CreditCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditErrorResponse'
        '502':
          $ref: '#/components/responses/CreditUpstreamFailure'
  /api/v1/checkout/credit:
    post:
      tags:
      - Orders
      - Credit
      summary: Create and pay for an order using account credit
      operationId: checkoutWithCredit
      description: >-
        The authenticated buyer is determined from the bearer token and the server
        calculates the total. Order creation, credit debit, stock decrement, invoice
        creation, and purchased cart quantity updates are atomic. Insufficient credit
        or stock causes no partial changes. No payment provider is called.
        A pending Mercado Pago order owned by the buyer blocks a new credit checkout.
        After the pending order is resolved, start a new attempt with a new key.
        A 400 INVALID response is a local validation rejection and does not establish
        whether an earlier request with the key completed. If an earlier outcome is
        unknown, retry the original request with the same key. A 400
        ADDRESS_REQUIRED_RECORDED response is a Core rejection recorded against
        the key; retrying the same payload returns that rejection while its record
        is retained, and corrected input requires a new key during that period.
        The older ADDRESS_REQUIRED code is ambiguous
        and does not confirm whether the key was recorded.
        All error fields must be sanitized and must never contain gift card codes
        or bearer tokens.
      security:
      - BearerAuth: []
