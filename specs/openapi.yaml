        '502':
          description: Core could not confirm the operation.
  /api/v1/admin/gift-cards:
    post:
      tags:
      - Administration
      summary: Issue a single-use gift card
      description: >-
        Creates a card for an administrator and returns its code only once.
        The code must not be logged or cached. Repeated requests create separate cards.
        All error fields must be sanitized and must never contain gift card codes
        or bearer tokens.
      operationId: adminCreateGiftCard
      security:
      - BearerAuth: []
      - XOpKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminGiftCardCreateRequest'
      responses:
        '201':
          description: Gift card issued; the code is returned only once.
          headers:
            Cache-Control:
              required: true
              description: Prevents the response containing the card code from being cached.
              schema:
                type: string
                enum:
                - no-store
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGiftCardCreateResponse'
        '400':
          description: Invalid amount or request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Administrator permission required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Core unavailable or invalid response; issuance outcome may be unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    XOpKey:
      type: apiKey
      in: header
      name: X-Op-Key
      description: Operations key for privileged internal operations (one-time raw
        key shown at creation).
  parameters:
    CreditIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated UUID scoped to the authenticated buyer and operation.
        A repeated request with the same key and payload returns the original
        successful response snapshot without repeating effects, with no expiration.
        Core retains recorded rejections for 30 days; after expiration the key may
        be processed as a new request. A different payload reaching Core's
        idempotency check while a record exists returns 409. Validation
        in the BFF or Core may reject a request before that check. If the outcome is unknown after an upstream
        failure, retry the same request with the same key. Never persist raw card codes.
      schema:
        type: string
        format: uuid
    GuestCartCookie:
      name: cart_id
      in: cookie
      required: false
      description: Opaque guest cart identifier issued by the BFF in an HttpOnly,
        SameSite=Lax cookie. The default name is cart_id and can be changed with CART_COOKIE_NAME.
        Secure defaults on outside debug/development and is configurable with CART_COOKIE_SECURE.
        This is not a user identifier; Core selects authenticated carts from the Bearer
        token.
      schema:
        type: string
    Search:
      name: search
      in: query
      required: false
      description: Case-insensitive search over product name or publisher.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    YearPublished:
      name: year_published
      in: query
      required: false
      description: Exact publication year.
      schema:
        type: integer
        minimum: 0
        maximum: 9999
    MinPlayers:
      name: min_players
      in: query
      required: false
      description: Minimum requested player count.
      schema:
        type: integer
        minimum: 1
        maximum: 999
    MaxPlayers:
      name: max_players
      in: query
      required: false
      description: Maximum requested player count.
      schema:
        type: integer
        minimum: 1
        maximum: 999
    CategoryId:
      name: category_id
      in: query
      required: false
      description: Category identifier (1 strategy, 2 thematic, 3 family).
      schema:
        type: integer
        minimum: 1
    CategoryName:
      name: category_name
      in: query
      required: false
      description: Exact category name returned by the product categories endpoint.
      schema:
        type: string
        minLength: 1
    PriceMin:
      name: price_min
      in: query
      required: false
      description: Inclusive minimum price.
      schema:
        type: number
        format: double
        minimum: 0
    PriceMax:
      name: price_max
      in: query
      required: false
      description: Inclusive maximum price.
      schema:
        type: number
        format: double
        minimum: 0
    Page:
      name: page
      in: query
      required: false
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: Number of products per page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      example: 50
  headers:
    CreditCacheControl:
      required: true
      description: Prevents credit responses from being cached.
      schema:
        type: string
        enum:
        - no-store
  responses:
    AdminStockMovementRequestError:
      description: Sanitized error; a valid movement UUID is included when available.
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/AdminErrorResponse'
            - $ref: '#/components/schemas/AdminStockMovementError'
    AdminInvalidRequest:
      description: Invalid input or a sanitized field-level business error.
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/AdminErrorResponse'
            - $ref: '#/components/schemas/AdminFieldErrorResponse'
    AdminUnauthorized:
      description: Authentication is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorResponse'
    AdminForbidden:
      description: Administrative permission is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorResponse'
    AdminConflict:
      description: A coupon with the exact code already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminFieldErrorResponse'
    AdminCouponFailure:
      description: >-
        Core could not complete the coupon operation or returned an invalid
        response. Upstream failure details are not exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorResponse'
    AdminNotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorResponse'
    AdminUpstreamFailure:
      description: Core is unavailable or returned an invalid response; upstream details must not be exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorResponse'
    CreditInvalidRequest:
      description: Sanitized error for an invalid request body or idempotency key.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CreditCacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreditErrorResponse'
    CreditUnauthorized:
      description: Sanitized error for a missing or invalid bearer token.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CreditCacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreditErrorResponse'
    CreditUpstreamFailure:
      description: >-
        Core is unavailable or returned an invalid response. For POST requests the
        outcome may be unknown; retry the same request with the same idempotency key.
        The response must not include upstream information, gift card codes, or tokens.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CreditCacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreditUpstreamError'
  schemas:
    CatalogEvent:
      type: object
      additionalProperties: false
      required:
      - event_id
      - event_type
      - occurred_at
      - aggregate_type
      - aggregate_id
      properties:
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum:
          - product.changed
          - stock.changed
          - promotion.changed
        occurred_at:
          type: string
          format: date-time
          description: UTC timestamp ending in Z or with a zero UTC offset.
        aggregate_type:
          type: string
          description: Must match the event type prefix; stock aggregate IDs are product BGG IDs.
          enum:
          - product
          - stock
          - promotion
        aggregate_id:
          type: string
          description: Product BGG ID for product or stock events; promotion ID for promotion events.
          minLength: 1
          maxLength: 128
    AuthRefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          writeOnly: true
    AuthRefreshResponse:
      type: object
      required:
      - access_token
      properties:
        access_token:
          type: string
    AuthRefreshErrorResponse:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
    CreditErrorResponse:
      type: object
      additionalProperties: false
      description: >-
        All error fields must be sanitized and must never contain gift card codes
        or bearer tokens.
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - code
            - message
            properties:
              code:
                type: string
              message:
                type: string
                description: Sanitized public error message.
              field:
                type:
                - array
                - 'null'
                items:
                  type: string
    CreditUpstreamError:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: string
          enum:
          - Credit service unavailable
    CreditBalance:
      type: object
      additionalProperties: false
      required:
      - balance
      - currency
      properties:
        balance:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
          description: Available balance as a decimal string with two fractional digits.
          example: '20000.00'
        currency:
          type: string
          enum:
          - ARS
    RedeemGiftCardRequest:
      type: object
      additionalProperties: false
      required:
      - code
      properties:
        code:
          type: string
          writeOnly: true
          description: Sensitive single-use gift card code.
    CreditCheckoutResponse:
      type: object
      additionalProperties: false
      required:
      - order
      - credit
      properties:
        order:
          allOf:
          - $ref: '#/components/schemas/PurchaseOrder'
          - type: object
            required:
            - status
            - invoice
            properties:
              status:
                type: string
                enum:
                - paid
              invoice:
                $ref: '#/components/schemas/Invoice'
        credit:
          $ref: '#/components/schemas/CreditBalance'
    AdminGiftCardCreateRequest:
      type: object
      additionalProperties: false
      required:
      - amount
      properties:
        amount:
          type: string
          pattern: '^[0-9]{1,10}(\.[0-9]{1,2})?$'
          description: Positive amount in ARS, with up to two decimal places.
          example: '20000.00'
    AdminGiftCardCreateResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - code
      - amount
      - currency
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Sensitive redemption code returned only once.
        amount:
          type: string
          example: '20000.00'
        currency:
          type: string
          enum:
          - ARS
    CartItemRequest:
      type: object
      required:
      - bgg_id
      - quantity
      properties:
        bgg_id:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: BoardGameGeek product identifier.
        quantity:
          type: integer
          minimum: 1
          maximum: 2147483647
    CartQuantityRequest:
      type: object
      required:
      - quantity
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 2147483647
    CartLine:
      type: object
      required:
      - bgg_id
      - name
      - quantity
      - available_stock
      - unit_price
      - subtotal
      properties:
        bgg_id:
          type: integer
          minimum: 1
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        available_stock:
          type: integer
          minimum: 0
          description: Current product inventory; cart edits do not reserve stock.
        unit_price:
          type: number
          format: double
        subtotal:
          type: number
          format: double
    CartWarning:
      type: object
      required:
      - code
      - message
      properties:
        field:
          type: array
          nullable: true
          items:
            type: string
        code:
          type: string
          example: INSUFFICIENT_STOCK
        message:
          type: string
    CartResponse:
      type: object
      required:
      - lines
      - total
      - warnings
      properties:
        lines:
          type: array
          items:
