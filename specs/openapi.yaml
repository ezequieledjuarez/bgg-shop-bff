          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderLine'
        invoice:
          allOf:
          - $ref: '#/components/schemas/Invoice'
          nullable: true
    PurchaseOrderLine:
      type: object
      required:
      - bgg_id
      - name
      - unit_price
      - quantity
      - subtotal
      properties:
        bgg_id:
          type: integer
        name:
          type: string
        unit_price:
          type: number
          format: float
        quantity:
          type: integer
        subtotal:
          type: number
          format: float
    Invoice:
      type: object
      required:
      - number
      - issued_at
      - total
      properties:
        number:
          type: integer
          format: int64
        issued_at:
          type: string
          format: date-time
        total:
          type: number
          format: float
    OrderErrorResponse:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
              message:
                type: string
              field:
                type: array
                nullable: true
                items:
                  type: string
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          description: Stable high-level error message.
          example: upstream GraphQL request failed
        detail:
          type: string
          description: Optional diagnostic detail.
          example: GraphQL upstream returned errors
