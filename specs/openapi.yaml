        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: cursor
        in: query
        required: false
        description: Opaque signed cursor copied unchanged from next_cursor; omit for the first page.
        schema:
          type: string
          minLength: 1
          maxLength: 512
      - name: limit
        in: query
        required: false
        description: Maximum users per page.
