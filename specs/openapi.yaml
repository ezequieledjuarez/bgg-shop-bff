openapi: 3.2.0
info:
  title: BGG Shop BFF API
  version: 1.0.0
  description: REST API exposed by the BFF for the board-game catalog and CU-C02 filters.
paths:
  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a customer account
      description: Creates a local customer account using email and password credentials.
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Customer account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Request body or registration data is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '409':
          description: An account with the email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '502':
          description: The BFF could not obtain a valid response from the Core GraphQL service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate a customer
      description: Authenticates a customer using local email and password credentials.
      operationId: loginAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Customer authenticated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '401':
          description: Email or password is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '502':
          description: The BFF could not obtain a valid response from the Core GraphQL service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/products:
    get:
      tags:
        - Products
      summary: List and filter board-game products
      description: Returns a paginated collection filtered by optional catalog criteria.
      operationId: listProducts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/YearPublished'
        - $ref: '#/components/parameters/MinPlayers'
        - $ref: '#/components/parameters/MaxPlayers'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/PriceMin'
        - $ref: '#/components/parameters/PriceMax'
      responses:
        '200':
          description: Paginated product collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
              example:
                items:
                  - bgg_id: 274364
                    name: Watergate
                    release_year: 2019
                    min_players: 2
                    max_players: 2
                    playing_time_minutes: 60
                    min_age: 12
                    weight: 2.25
                    category:
                      - Juegos de Estrategia
                    price: 90000.0
                    publisher: Salt & Pepper Games
                    image_url: /media/portadas/2743640.webp
                page: 1
                page_size: 20
                total: 1
                total_pages: 1
        '400':
          description: The pagination or filter parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: page_size must not exceed 100
        '502':
          description: The BFF could not obtain a valid response from the Core GraphQL service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: upstream GraphQL request failed
                detail: GraphQL upstream returned errors
  /api/v1/games/{slug}:
    get:
      tags:
        - Games
      summary: Get a board-game detail by slug
      operationId: getGameDetail
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Product detail with approved reviews.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '404':
          description: The game does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The Core GraphQL service is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/games/{slug}/reviews:
    post:
      tags:
        - Reviews
      summary: Submit a board-game review
      operationId: createGameReview
      security:
        - BearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Review created and awaiting moderation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReviewResponse'
        '400':
          description: Review data is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The game does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The user already reviewed this game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Search:
      name: search
      in: query
      required: false
      description: Case-insensitive search over product name or publisher.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    YearPublished:
      name: year_published
      in: query
      required: false
      description: Exact publication year.
      schema:
        type: integer
        minimum: 0
        maximum: 9999
    MinPlayers:
      name: min_players
      in: query
      required: false
      description: Minimum requested player count.
      schema:
        type: integer
        minimum: 1
        maximum: 999
    MaxPlayers:
      name: max_players
      in: query
      required: false
      description: Maximum requested player count.
      schema:
        type: integer
        minimum: 1
        maximum: 999
    CategoryId:
      name: category_id
      in: query
      required: false
      description: Category identifier (1 strategy, 2 thematic, 3 family).
      schema:
        type: integer
        minimum: 1
    PriceMin:
      name: price_min
      in: query
      required: false
      description: Inclusive minimum price.
      schema:
        type: number
        format: double
        minimum: 0
    PriceMax:
      name: price_max
      in: query
      required: false
      description: Inclusive maximum price.
      schema:
        type: number
        format: double
        minimum: 0
    Page:
      name: page
      in: query
      required: false
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: Number of products per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
  schemas:
    CreateReviewRequest:
      type: object
      required:
        - rating
        - body
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        body:
          type: string
          minLength: 1
          maxLength: 2000
    CreateReviewResponse:
      type: object
      required:
        - created
        - status
        - created_at
      properties:
        created:
          type: boolean
        status:
          type: string
          enum:
            - PENDING
        created_at:
          type: string
          format: date-time
    ReviewSummary:
      type: object
      required:
        - approved_review_count
      properties:
        approved_review_count:
          type: integer
          minimum: 0
        average_rating:
          type: number
          format: double
          nullable: true
    ApprovedReview:
      type: object
      required:
        - rating
        - body
        - created_at
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        body:
          type: string
        created_at:
          type: string
          format: date-time
    ProductDetail:
      type: object
      required:
        - name
        - release_year
        - min_players
        - max_players
        - playing_time_minutes
        - min_age
        - weight
        - category
        - price
        - publisher
        - image_url
        - review_summary
        - approved_reviews
      properties:
        name:
          type: string
        release_year:
          type: integer
        min_players:
          type: integer
        max_players:
          type: integer
        playing_time_minutes:
          type: integer
        min_age:
          type: integer
        weight:
          type: number
        category:
          type: array
          items:
            type: string
        price:
          type: number
        publisher:
          type: string
        image_url:
          type: string
        review_summary:
          $ref: '#/components/schemas/ReviewSummary'
        approved_reviews:
          type: array
          items:
            $ref: '#/components/schemas/ApprovedReview'
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - first_name
        - last_name
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
        first_name:
          type: string
          minLength: 1
          maxLength: 150
        last_name:
          type: string
          minLength: 1
          maxLength: 150
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
    AuthUser:
      type: object
      required:
        - id
        - email
        - first_name
        - last_name
        - is_active
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        is_active:
          type: boolean
    AuthSession:
      type: object
      required:
        - access_token
        - refresh_token
      properties:
        access_token:
          type: string
          description: JWT access token for Bearer authentication.
        refresh_token:
          type: string
          nullable: true
        csrf_token:
          type: string
          nullable: true
    AuthError:
      type: object
      required:
        - message
      properties:
        field:
          type: array
          nullable: true
          items:
            type: string
        code:
          type: string
          nullable: true
        message:
          type: string
    AuthErrorResponse:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/AuthError'
    RegisterResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        session:
          $ref: '#/components/schemas/AuthSession'
          nullable: true
    LoginResponse:
      type: object
      required:
        - user
        - session
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        session:
          $ref: '#/components/schemas/AuthSession'
    Product:
      type: object
      required:
        - bgg_id
        - name
        - release_year
        - min_players
        - max_players
        - playing_time_minutes
        - min_age
        - weight
        - category
        - price
        - publisher
        - image_url
      properties:
        bgg_id:
          type: integer
          description: BoardGameGeek identifier.
          example: 274364
        name:
          type: string
          example: Watergate
        release_year:
          type: integer
          example: 2019
        min_players:
          type: integer
          example: 2
        max_players:
          type: integer
          example: 2
        playing_time_minutes:
          type: integer
          example: 60
        min_age:
          type: integer
          example: 12
        weight:
          type: number
          format: double
          example: 2.25
        category:
          type: array
          items:
            type: string
          example:
            - Juegos de Estrategia
        price:
          type: number
          format: double
          example: 90000.0
        publisher:
          type: string
          example: Salt & Pepper Games
        image_url:
          type: string
          example: /media/portadas/2743640.webp
    ProductPage:
      type: object
      required:
        - items
        - page
        - page_size
        - total
        - total_pages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
          minimum: 1
          example: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        total:
          type: integer
          minimum: 0
          example: 1
        total_pages:
          type: integer
          minimum: 0
          example: 1
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Stable high-level error message.
          example: upstream GraphQL request failed
        detail:
          type: string
          description: Optional diagnostic detail.
          example: GraphQL upstream returned errors
