          $ref: '#/components/responses/ReviewModerationUpstreamFailure'
  /api/v1/admin/reviews/{review_id}/actions:
    post:
      tags:
      - Administration
      summary: Accept, reject, or soft-delete a review
      description: >-
        Applies one moderation action using Core as the authority for current
        state. ACCEPT on an accepted review and REJECT on a rejected review are
        successful idempotent no-ops. Repeated DELETE is also idempotent success.
        Core locks the review row and serializes actions; the last serialized
        action is final. An unknown ID or a non-delete action on a soft-deleted
        review returns 404. Return 409 only for a genuinely invalid transition,
        not for a stale queue view or concurrent action. DELETE retains the row,
        sets its separate deleted marker, excludes it from public visibility and
        aggregation, and reports deleted=true. If Core commits but cache
        invalidation remains pending after bounded retries, the response still
        reports success and sets cache_refresh_pending=true; public detail may
        be temporarily stale until refresh succeeds. Requires an authenticated
        active staff or superuser identity; an operation key alone is insufficient.
      operationId: adminModerateReview
      security:
      - BearerAuth: []
      parameters:
      - name: review_id
        in: path
        required: true
        description: Existing product_review identifier.
        schema:
          type: integer
          minimum: 1
        example: 501
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerateReviewRequest'
            examples:
              accept:
                value: {action: ACCEPT}
              reject:
                value: {action: REJECT}
              softDelete:
                value: {action: DELETE}
      responses:
        '200':
          description: >-
            Action applied or already in the requested state. A committed Core
            mutation remains successful even if cache refresh is pending.
          headers:
            Cache-Control:
              $ref: '#/components/headers/AdminNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerateReviewResponse'
              examples:
                accepted:
                  value:
                    review_id: 501
                    status: ACCEPTED
                    deleted: false
                    publicly_visible: true
                    cache_refresh_pending: false
                deleted:
                  value:
                    review_id: 501
                    status: ACCEPTED
                    deleted: true
                    publicly_visible: false
                    cache_refresh_pending: false
                committedButRefreshPending:
                  summary: Mutation committed; cache refresh must be retried
                  value:
                    review_id: 501
                    status: ACCEPTED
                    deleted: false
                    publicly_visible: true
                    cache_refresh_pending: true
        '400':
          $ref: '#/components/responses/ReviewModerationInvalidRequest'
        '401':
          $ref: '#/components/responses/ReviewModerationUnauthorized'
        '403':
          $ref: '#/components/responses/ReviewModerationForbidden'
        '404':
          $ref: '#/components/responses/ReviewModerationNotFound'
        '409':
          $ref: '#/components/responses/ReviewModerationConflict'
        '502':
          $ref: '#/components/responses/ReviewModerationUpstreamFailure'
