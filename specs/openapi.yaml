        rating:
          type: integer
          minimum: 1
          maximum: 5
        body:
          type: string
          minLength: 1
          maxLength: 2000
        created_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ReviewModerationStatus'
    AdminReviewPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminReview'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
    ModerateReviewRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          $ref: '#/components/schemas/ReviewModerationAction'
    ModerateReviewResponse:
      type: object
      additionalProperties: false
      required: [review_id, status, deleted, publicly_visible, cache_refresh_pending]
      properties:
        review_id:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ReviewModerationStatus'
          description: Retained moderation status; soft-deletion is represented separately.
        deleted:
          type: boolean
        publicly_visible:
          type: boolean
        cache_refresh_pending:
          type: boolean
          description: >-
            True when Core committed the action but BFF cache invalidation has
            not yet succeeded after bounded retries. The mutation itself succeeded;
            public detail may remain temporarily stale until refresh completes.
    ReviewModerationFieldErrorResponse:
      type: object
      additionalProperties: false
      required: [errors]
      properties:
        errors:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
              field:
                type: string
              code:
                type: string
                enum: [INVALID, REVIEW_NOT_FOUND, INVALID_TRANSITION]
              message:
                type: string
    ReviewModerationUpstreamFailureResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          const: upstream GraphQL request failed
    AdminFieldErrorResponse:
      type: object
      additionalProperties: false
      required:
      - errors
      properties:
        errors:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - code
            - message
            properties:
              field:
                type: string
                description: Public input field name, when applicable.
              code:
                type: string
              message:
                type: string
                description: Sanitized public message.
    AdminProductPage:
