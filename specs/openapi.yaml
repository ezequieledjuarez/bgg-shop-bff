openapi: 3.2.0
info:
  title: BGG Shop BFF API
  version: 1.0.0
  description: REST API exposed by the BFF for the board-game catalog and CU-C02 filters.
paths:
  /api/v1/products:
    get:
      tags:
        - Products
      summary: List and filter board-game products
      description: Returns a paginated collection filtered by optional catalog criteria.
      operationId: listProducts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/YearPublished'
        - $ref: '#/components/parameters/MinPlayers'
        - $ref: '#/components/parameters/MaxPlayers'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/PriceMin'
        - $ref: '#/components/parameters/PriceMax'
      responses:
        '200':
          description: Paginated product collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
              example:
                items:
                  - bgg_id: 274364
                    name: Watergate
                    release_year: 2019
                    min_players: 2
                    max_players: 2
                    playing_time_minutes: 60
                    min_age: 12
                    weight: 2.25
                    category:
                      - Juegos de Estrategia
                    price: 90000.0
                    publisher: Salt & Pepper Games
                    image_url: /media/portadas/2743640.webp
                page: 1
                page_size: 20
                total: 1
                total_pages: 1
        '400':
          description: The pagination or filter parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: page_size must not exceed 100
        '502':
          description: The BFF could not obtain a valid response from the Core GraphQL service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: upstream GraphQL request failed
                detail: GraphQL upstream returned errors
components:
  parameters:
    Search:
      name: search
      in: query
      required: false
      description: Case-insensitive search over product name or publisher.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    YearPublished:
      name: year_published
      in: query
      required: false
      description: Exact publication year.
      schema:
        type: integer
        minimum: 0
        maximum: 9999
    MinPlayers:
      name: min_players
      in: query
      required: false
      description: Minimum requested player count.
      schema:
        type: integer
        minimum: 1
        maximum: 999
    MaxPlayers:
      name: max_players
      in: query
      required: false
      description: Maximum requested player count.
      schema:
        type: integer
        minimum: 1
        maximum: 999
    CategoryId:
      name: category_id
      in: query
      required: false
      description: Category identifier (1 strategy, 2 thematic, 3 family).
      schema:
        type: integer
        minimum: 1
    PriceMin:
      name: price_min
      in: query
      required: false
      description: Inclusive minimum price.
      schema:
        type: number
        format: double
        minimum: 0
    PriceMax:
      name: price_max
      in: query
      required: false
      description: Inclusive maximum price.
      schema:
        type: number
        format: double
        minimum: 0
    Page:
      name: page
      in: query
      required: false
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: Number of products per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
  schemas:
    Product:
      type: object
      required:
        - bgg_id
        - name
        - release_year
        - min_players
        - max_players
        - playing_time_minutes
        - min_age
        - weight
        - category
        - price
        - publisher
        - image_url
      properties:
        bgg_id:
          type: integer
          description: BoardGameGeek identifier.
          example: 274364
        name:
          type: string
          example: Watergate
        release_year:
          type: integer
          example: 2019
        min_players:
          type: integer
          example: 2
        max_players:
          type: integer
          example: 2
        playing_time_minutes:
          type: integer
          example: 60
        min_age:
          type: integer
          example: 12
        weight:
          type: number
          format: double
          example: 2.25
        category:
          type: array
          items:
            type: string
          example:
            - Juegos de Estrategia
        price:
          type: number
          format: double
          example: 90000.0
        publisher:
          type: string
          example: Salt & Pepper Games
        image_url:
          type: string
          example: /media/portadas/2743640.webp
    ProductPage:
      type: object
      required:
        - items
        - page
        - page_size
        - total
        - total_pages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
          minimum: 1
          example: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        total:
          type: integer
          minimum: 0
          example: 1
        total_pages:
          type: integer
          minimum: 0
          example: 1
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Stable high-level error message.
          example: upstream GraphQL request failed
        detail:
          type: string
          description: Optional diagnostic detail.
          example: GraphQL upstream returned errors
