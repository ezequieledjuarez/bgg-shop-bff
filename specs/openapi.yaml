    AdminPromotionFields:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        discount_percent:
          type: number
          minimum: 0
          maximum: 50
          description: Percentage discount from zero through 50, inclusive.
        product_bgg_id:
          type: integer
          minimum: 1
          nullable: true
          description: >-
            Optional product BGG identifier; omitted or null means a global
            store offer. For each product, an eligible specific offer wins;
            otherwise the highest eligible global percentage applies. Offers
            do not stack. Coupon-linked promotion rows are not store offers.
        active:
          type: boolean
          description: >-
            Manual switch independent of validity dates. A disabled promotion
            must not apply even within its validity period; an enabled
            promotion remains subject to its dates. Existing promotions remain
            inactive when the field is introduced. At most one active
            promotion may reference each product.
