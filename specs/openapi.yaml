                $ref: '#/components/schemas/AdminCoupon'
        '400':
          $ref: '#/components/responses/AdminInvalidRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '409':
          $ref: '#/components/responses/AdminConflict'
        '502':
          $ref: '#/components/responses/AdminCouponFailure'
  /api/v1/admin/coupons/{coupon_id}:
    patch:
      tags:
      - Administration
      summary: Partially update an administrative coupon
      description: >-
        Applies only supplied fields; code is immutable and no physical-delete
        operation exists, so coupons are deactivated through active=false.
        Discount changes update the associated product-less promotion. The
        coupon, promotion update, and audit entry containing actor, action,
        target, previous values, and new values commit atomically. Credentials
        are never written to audit history. Requires an active staff or
        superuser account.
      operationId: adminUpdateCoupon
      x-implementation-status: planned
      security:
      - BearerAuth: []
      parameters:
      - name: coupon_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateCouponRequest'
      responses:
        '200':
          description: Coupon updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCoupon'
        '400':
          $ref: '#/components/responses/AdminInvalidRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/AdminNotFound'
        '502':
          $ref: '#/components/responses/AdminCouponFailure'
  /api/v1/admin/audit:
    get:
      tags:
      - Administration
      summary: List administrative audit records
      description: >-
        Returns product, stock, promotion, and coupon audit records ordered by
        created_at DESC, id DESC using opaque signed cursor pagination. All
        filters are optional exact matches except the inclusive UTC date range.
        Date-times must include a timezone designator and are normalized to UTC.
        Values stored under keys naming credentials, tokens, passwords, secrets,
        authorization data, or payment/card data are replaced with "[REDACTED]"
        before the response is returned. Responses are not cacheable. Requires
        an active staff or superuser account.
      operationId: adminListAuditRecords
      x-implementation-status: planned
      security:
      - BearerAuth: []
      parameters:
      - name: entity_type
        in: query
        required: false
        description: Exact entity type, such as product_boardgame, promotion, or coupon.
        schema:
          type: string
          minLength: 1
          maxLength: 150
      - name: entity_id
        in: query
        required: false
        description: Exact entity identifier.
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - name: actor_id
        in: query
        required: false
        description: Exact administrator identifier.
        schema:
          type: string
          minLength: 1
          maxLength: 150
      - name: action
        in: query
        required: false
        description: Exact action, such as product_created, stock_in, promotion_updated, or coupon_created.
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - name: created_from
        in: query
        required: false
        description: Inclusive lower bound; a timezone designator is required.
        schema:
          type: string
          format: date-time
      - name: created_to
        in: query
        required: false
        description: Inclusive upper bound; a timezone designator is required and must not precede created_from.
        schema:
          type: string
          format: date-time
      - name: cursor
        in: query
        required: false
        description: Opaque cursor copied unchanged from next_cursor.
        schema:
          type: string
          minLength: 1
          maxLength: 512
      - name: limit
        in: query
        required: false
        description: Maximum records per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Audit page.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuditPage'
        '400':
          $ref: '#/components/responses/AdminInvalidRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '502':
          $ref: '#/components/responses/AdminUpstreamFailure'
  /api/v1/admin/sales-metrics:
    get:
      tags:
      - Administration
      summary: Get administrative sales metrics
      description: >-
        Returns gross sales metrics for an active staff or superuser account.
        from and to are individually optional timezone-aware ISO instants
        normalized to UTC and define the half-open range [from, to). Callers
        must provide both bounds or omit both; if exactly one is supplied, the
        request returns INVALID and identifies the missing bound in field.
        When both are omitted, the range defaults to the last 30 days. The
        maximum range is 366 days.
        Revenue and orders_count use paid orders by paid_at; payment and
        dispatch status counts use orders by created_at. Gross revenue is the
        sum of purchase-order line subtotals and may differ from the order
        total. Category filtering uses exact stored category strings; category
        and product filters restrict matching lines, and each matching order
        is counted once. Dispatch status is derived at query time from paid_at:
        Pendiente for pending_payment, En preparación before 24 hours, Enviado
        from 24 to less than 72 hours, and Entregado at 72 hours or later.
        pickup orders follow the same rule; rejected, cancelled and
        paid_stock_conflict orders have no dispatch status. Invalid input
        returns 400. Responses are not cacheable. Runtime behavior is planned.
      operationId: adminGetSalesMetrics
      x-implementation-status: planned
      security:
      - BearerAuth: []
      parameters:
      - name: from
        in: query
        required: false
        description: Optional inclusive UTC lower bound; provide together with to or omit both bounds. A timezone designator is required.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        description: Optional exclusive UTC upper bound; provide together with from or omit both bounds. A timezone designator is required.
        schema:
          type: string
          format: date-time
      - name: category
        in: query
        required: false
        description: Exact stored category filter; repeat to select multiple categories.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: product_id
        in: query
        required: false
        description: Product BGG identifier filter; repeat to select multiple products.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        '200':
          description: Sales metrics.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSalesMetrics'
        '400':
          $ref: '#/components/responses/AdminInvalidRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
  /api/v1/admin/sales-metrics/categories:
    get:
      tags:
      - Administration
      summary: List sales-metrics category filters
      description: >-
        Returns distinct stored product category strings for the sales-metrics
        filter. Requires an active staff or superuser account. Responses are
        not cacheable. Runtime behavior is planned.
      operationId: adminGetSalesCategories
      x-implementation-status: planned
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Distinct stored category strings.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '502':
          $ref: '#/components/responses/AdminUpstreamFailure'
  /api/v1/cart/coupons/preview:
    post:
      tags:
      - Cart
      summary: Preview a coupon against the authenticated user's current cart
      description: >-
        This read-only preview uses the authenticated user's current cart and
        does not reserve or consume a coupon use. Coupon codes are matched by
        exact, case-sensitive equality, without normalization. Inactive,
        not-yet-valid, expired, exhausted or over-limit coupons return a
        rejected preview with a reason; a missing coupon returns 404.
        Validity timestamps are UTC; the start is inclusive and the end is
        exclusive, and if both are configured the start must precede the end.
        Preserve decimal precision while calculating each alternative, then
        round each total upward once to whole pesos. Select the greater saving;
        ties favor the store promotion.
        A discount above 50% of the undiscounted cart subtotal is rejected, not
        capped. Runtime behavior is not established by this contract.
      operationId: previewCartCoupon
      x-implementation-status: planned
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponPreviewRequest'
      responses:
        '200':
          description: Read-only coupon estimate for the current cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponPreviewResponse'
        '400':
          $ref: '#/components/responses/AdminInvalidRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '404':
          description: No coupon exists with the exact supplied code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '502':
          $ref: '#/components/responses/AdminUpstreamFailure'
  /api/v1/admin/op-sessions:
    get:
      tags:
      - Administration
      summary: List operation-key sessions
      operationId: adminListOperationSessions
      security:
      - BearerAuth: []
      - XOpKey: []
      parameters:
      - name: user_id
