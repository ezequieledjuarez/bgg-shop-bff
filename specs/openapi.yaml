  /api/v1/gift-cards/redeem:
    post:
      tags:
      - Credit
      summary: Redeem a gift card into the authenticated buyer's credit
      operationId: redeemGiftCard
      description: >-
        The card is consumed and its full value is credited atomically. Gift card
        codes and bearer tokens must not be logged. Codes must not be included in
        URLs or returned in responses. All error fields must be sanitized and must
        never contain gift card codes or bearer tokens.
        Invalid and already redeemed codes must produce indistinguishable errors.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CreditIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
