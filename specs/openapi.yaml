openapi: 3.2.0
info:
  title: BGG Shop BFF API
  version: 1.0.0
  description: REST API exposed by the BFF for the board-game catalog, shopping cart,
    and purchase orders. Administrative operations require an active authenticated
    user with is_staff or is_superuser, except personnel selection and privilege
    administration, which require an active is_superuser regardless of is_staff.
    An operation key alone does not grant admin access. These contracts do not
    establish runtime conformance.
paths:
  /internal/v1/catalog-events:
    post:
      tags:
      - Internal Events
      summary: Invalidate public catalog caches from Core
      description: >-
        Accepts a minimal versioned catalog event authenticated by an HMAC-SHA256
        signature over the exact request body. This internal endpoint does not
        accept product, customer, or payment payloads.
      operationId: receiveCatalogEvent
      parameters:
      - name: X-Catalog-Event-Signature
        in: header
        required: true
        description: HMAC-SHA256 of the exact request body, prefixed with sha256=.
        schema:
          type: string
          pattern: '^sha256=[0-9a-f]{64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogEvent'
      responses:
        '204':
          description: Event accepted and public catalog cache generation advanced.
        '400':
          description: Event envelope is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Signature is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Shared-secret configuration or cache invalidation is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/me:
    get:
      tags:
      - Authentication
      summary: Read the current authenticated user's administrative flags
      description: >-
        Returns only the current active user's staff and superuser flags from
        Core Query.me. The projection is a navigation hint, not authorization.
        Requires bearer authentication; operation-key-only access is rejected.
        Every response is non-cacheable.
      operationId: getCurrentUserCapabilities
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Current user's role flags.
          headers:
            Cache-Control:
              required: true
              description: Role snapshots must not be cached.
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserCapabilities'
              example:
                is_staff: true
                is_superuser: false
        '401':
          description: Missing, invalid, or inactive user identity.
          headers:
            Cache-Control:
              required: true
              description: Authentication results must not be cached.
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                errors:
                - code: UNAUTHENTICATED
                  message: Authentication is required.
        '502':
          description: Core identity could not be resolved; upstream details are omitted.
          headers:
            Cache-Control:
              required: true
              description: Identity resolution failures must not be cached.
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                errors:
                - code: UPSTREAM_FAILURE
                  message: The current user could not be verified.
  /api/v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Register a pending customer account
      description: >-
        Creates a local customer account in the PENDING email-verification state
        without signing in. Core commits the account and its verification challenge
        together, then submits one verification message after commit. A delivery
        failure after commit still returns 201 with delivery_status UNCONFIRMED.
        A duplicate email stays 409 and never implicitly resends. No session,
        credential or cookie is issued. Every response is non-cacheable.
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Pending customer account created; message submission is not proof of delivery.
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                user:
                  id: '123'
                  email: player@example.test
                  first_name: Test
                  last_name: Player
                  is_active: true
                verification:
                  state: PENDING
                  delivery_status: UNCONFIRMED
                  message: Verify your email before signing in. Delivery is not guaranteed; you can request another message.
        '400':
          description: Request body or registration data is invalid.
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '409':
          description: An account with the email already exists; no message is resent.
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '502':
          description: The BFF could not obtain a valid response from the Core GraphQL
            service.
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - {}
      - BearerAuth: []
      - XOpKey: []
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Authenticate a customer
      description: Authenticates a customer and merges any guest cart identified by
        the HttpOnly cart cookie.
      operationId: loginAccount
      parameters:
      - $ref: '#/components/parameters/GuestCartCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Customer authenticated successfully; the guest cart cookie
            is cleared after the Core merges it.
          headers:
            Cache-Control:
              required: true
              description: Prevents caching of session credentials.
              schema:
                type: string
                enum:
                - no-store
            Set-Cookie:
              description: Clears the guest cart cookie after successful login.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Request body is invalid.
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '401':
          description: Email or password is invalid, or the account is administratively inactive.
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: >-
            The password was valid but the email is not verified yet
            (EMAIL_NOT_VERIFIED). No token, cookie, operation key or guest-cart
            merge occurs and the guest cart cookie is retained.
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                errors:
                - code: EMAIL_NOT_VERIFIED
                  message: Verify your email before signing in.
        '502':
          description: The BFF could not obtain a valid response from the Core GraphQL
            service.
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - {}
      - BearerAuth: []
      - XOpKey: []
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      summary: End the local session and revoke an optional operation key
      description: >-
        When X-Op-Key is supplied, revokes that key in Core. Without a key,
        clears the refresh cookie. Existing JWT access tokens are not revoked.
      operationId: logoutAccount
      security:
      - {}
      parameters:
      - name: X-Op-Key
        in: header
        required: false
        schema:
          type: string
      responses:
        '204':
          description: The key is revoked or no key was supplied; the refresh cookie is cleared.
        '502':
          description: The BFF could not confirm operation-key revocation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh a customer access token
      description: >-
        Uses the refresh_token cookie or an optional request body token. A nonempty
        body token takes precedence. On success, a returned refresh token is rotated
        in an HttpOnly cookie and only the access token is returned in JSON. Core
        validates that the stored subject is still active and either email-verified
        or a legacy-exempt account before rotating; an ineligible subject is
        rejected with the same 401 detail shape.
      operationId: refreshAccessToken
      security:
      - {}
      parameters:
      - name: refresh_token
        in: cookie
        required: false
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshRequest'
      responses:
        '200':
          description: Access token refreshed; the refresh cookie is rotated when Core returns one.
          headers:
            Set-Cookie:
              description: Rotated HttpOnly refresh_token cookie when available.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRefreshResponse'
        '401':
          description: The refresh token is missing or rejected; the refresh cookie is cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRefreshErrorResponse'
        '502':
          description: Core is unavailable or returned an invalid response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRefreshErrorResponse'
  /api/v1/auth/email-verification/confirm:
    post:
      tags:
      - Authentication
      summary: Confirm email ownership with an explicit action
      description: >-
        Public; no bearer token or operation key is required. The body carries only
        the verification token (43 base64url characters). All missing, malformed,
        tampered, unknown, consumed, replaced and expired tokens return the same
        400 outcome. At most ten invalid attempts per caller in any rolling 900
        seconds; attempt eleven returns 429 and a valid token is not processed
        until the caller is allowed again. Confirmation never signs the user in.
        GET and HEAD never confirm and return 405. Every response is non-cacheable
        and no-referrer. The caller identity is derived server-side from the peer
        address and is never accepted from the request.
      operationId: confirmEmailVerification
      security:
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmEmailVerificationRequest'
            example:
              token: <VERIFICATION_TOKEN>
      responses:
        '200':
          description: Exactly one account was verified atomically; no credentials or user are returned.
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthNoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmEmailVerificationResponse'
        '400':
          description: One generic unusable-link outcome with no owner, token or reason detail.
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthNoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                errors:
                - code: INVALID_VERIFICATION_TOKEN
                  message: This link cannot be used. Sign in or request another verification message.
        '405':
          $ref: '#/components/responses/VerificationMethodNotAllowed'
        '429':
          $ref: '#/components/responses/VerificationThrottled'
        '502':
          $ref: '#/components/responses/VerificationUpstream'
        '503':
          $ref: '#/components/responses/VerificationUnavailable'
  /api/v1/auth/email-verification/resend:
    post:
      tags:
      - Authentication
      summary: Request another verification message with a neutral acknowledgment
      description: >-
        Public; no bearer token or operation key is required. Every well-formed
        email receives the same 202 body whether the account is pending, verified,
        legacy-exempt or nonexistent, including recipient suppression and delivery
        failure. Ten well-formed requests per caller in any rolling 3600 seconds;
        the eleventh returns 429 independent of membership. Recipient rules are
        applied inside Core without disclosure: 120 seconds since the latest
        issuance and at most two replacement issuances per rolling 3600 seconds. A
        replacement invalidates every older token and an older token is never
        restored. No automatic retry. Every response is non-cacheable.
      operationId: resendEmailVerification
      security:
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendEmailVerificationRequest'
      responses:
        '202':
          description: Request acknowledged; not a claim about account existence or delivery.
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendEmailVerificationResponse'
        '400':
          description: The email is malformed; the submitted value is not echoed.
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '405':
          $ref: '#/components/responses/VerificationMethodNotAllowed'
        '429':
          $ref: '#/components/responses/VerificationThrottled'
        '502':
          $ref: '#/components/responses/VerificationUpstream'
        '503':
          $ref: '#/components/responses/VerificationUnavailable'
  /api/v1/product-categories:
    get:
      tags:
      - Products
      summary: List available product category names
      operationId: listProductCategories
      responses:
        '200':
          description: Distinct category names from the catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '502':
          description: Core is unavailable or returned an invalid response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/product-publishers:
    get:
      tags:
      - Products
      summary: List public catalog publishers and distinct-game counts
      description: >-
        Returns the complete unpaginated publisher facet list from the public
        catalog. Counts are global across search, category, other filters, and
        pagination, and count distinct games rather than inventory units.
        Publisher identity is the trimmed stored name; duplicate values after
        trimming are grouped, case variants remain distinct, and spelling is
        preserved. Blank publisher values are excluded. Public products with
        zero inventory remain eligible when present in the catalog.
      operationId: listProductPublishers
      responses:
        '200':
          description: Complete ordered publisher facet list; empty means no eligible publishers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductPublisherFacet'
              example:
              - publisher: Kosmos
                product_count: 7
              - publisher: Salt & Pepper Games
                product_count: 3
        '502':
          description: Core is unavailable or returned invalid facet data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - {}
  /api/v1/chat/conversations:
    post:
      tags:
      - Chat
      summary: Create a buyer chat conversation
      description: >-
        Creates a conversation for the authenticated buyer or for a new anonymous
        browser scope. The BFF issues an opaque HttpOnly chat_session cookie for
        an anonymous scope when one is not already present. This cookie lasts
        only for the browser session and has no Max-Age or Expires attribute.
        The request never accepts an owner identifier or an internal Core
        assertion. For an anonymous scope, the BFF derives a fresh short-lived
        HMAC-SHA256 assertion from the chat_session cookie for each internal
        Core call and sends it only in X-Chat-Assertion; the browser never
        supplies or receives that assertion. Core validates the assertion and
        derives ownership only from its validated subject. When a bearer token
        is supplied, the new conversation belongs to that authenticated user
        and is not merged with or switched to an anonymous scope.
      operationId: createChatConversation
      x-implementation-status: planned
      responses:
        '201':
          description: A new empty conversation was created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/ChatNoStore'
            Set-Cookie:
              required: false
              description: >-
                Present for a newly created anonymous browser scope only.
                The opaque chat_session cookie is HttpOnly, SameSite=Lax, and
                Secure outside local development. It is a non-persistent
                browser-session cookie with no Max-Age or Expires attribute
                and is not a user identifier.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatConversationResponse'
        '429':
          $ref: '#/components/responses/ChatRateLimited'
        '401':
          $ref: '#/components/responses/ChatUnauthorized'
        '503':
          $ref: '#/components/responses/ChatUnavailable'
      security:
      - BearerAuth: []
      - ChatSessionCookie: []
      - {}
  /api/v1/chat/conversations/{conversation_id}:
    parameters:
    - name: conversation_id
      in: path
      required: true
      description: Opaque conversation identifier issued by the BFF.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    get:
      tags:
      - Chat
      summary: Read an owned chat conversation
      description: >-
        Returns only the caller's conversation. The BFF resolves ownership from
        the current authenticated buyer or the same valid anonymous browser
        session; it never trusts an owner ID in the request. Missing, expired,
        and cross-scope conversations all return the same not-found response.
        When a bearer token is supplied it is authoritative; the anonymous
        cookie is used only when no bearer token is present. For anonymous
        Core calls, the BFF creates a fresh assertion for each call and sends
        it only in the internal X-Chat-Assertion header. No assertion or owner
        identifier is accepted from or returned to the browser. The anonymous
        chat_session cookie is non-persistent and lasts only for the browser
        session. No conversation messages or metadata are cached.
      operationId: getChatConversation
      x-implementation-status: planned
      responses:
        '200':
          description: The caller-owned conversation and its persisted messages.
          headers:
            Cache-Control:
              $ref: '#/components/headers/ChatNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatConversationResponse'
        '429':
          $ref: '#/components/responses/ChatRateLimited'
        '401':
          $ref: '#/components/responses/ChatUnauthorized'
        '404':
          $ref: '#/components/responses/ChatNotFound'
        '503':
          $ref: '#/components/responses/ChatUnavailable'
      security:
      - BearerAuth: []
      - ChatSessionCookie: []
    delete:
      tags:
      - Chat
      summary: Delete an owned chat conversation
      description: >-
        Deletes only the caller's Core-owned PostgreSQL conversation and its
        messages. This operation never deletes, changes, or re-ingests ChromaDB
        knowledge. Missing, expired, and cross-scope conversations all return
        the same not-found response. A bearer token is authoritative when
        supplied; the anonymous cookie is used only without a bearer token.
        The BFF uses a fresh internal X-Chat-Assertion for each anonymous Core
        call; the browser does not supply or receive this assertion. The
        anonymous chat_session cookie is non-persistent and lasts only for the
        browser session.
      operationId: deleteChatConversation
      x-implementation-status: planned
      responses:
        '204':
          description: The caller-owned conversation was deleted.
          headers:
            Cache-Control:
              $ref: '#/components/headers/ChatNoStore'
        '429':
          $ref: '#/components/responses/ChatRateLimited'
        '401':
          $ref: '#/components/responses/ChatUnauthorized'
        '404':
          $ref: '#/components/responses/ChatNotFound'
        '503':
          $ref: '#/components/responses/ChatUnavailable'
      security:
      - BearerAuth: []
      - ChatSessionCookie: []
  /api/v1/chat/conversations/{conversation_id}/messages:
    parameters:
    - name: conversation_id
      in: path
      required: true
      description: Opaque conversation identifier issued by the BFF.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    post:
      tags:
      - Chat
      summary: Submit a message and receive a grounded chat reply
      description: >-
        Accepts at most 2,000 characters and applies a shared limit of 10
        requests per minute per authenticated user or anonymous browser session
        across chatbot endpoints. The BFF applies its
        shop-scope guard before any retrieval, model, catalog, or Core
        conversation call. Out-of-scope, personal, account, and order content
        is not forwarded, persisted, or echoed. Only approved FAQ material and
        the existing live catalog read may be used. The model receives at most
        the 10 previous conversation turns. Dynamic catalog results are never
        written to ChromaDB. The response omits the submitted text and contains
        only approved-source metadata and facts returned by Core. Anonymous
        ownership is derived by Core from a validated BFF assertion. A bearer
        token is authoritative when supplied; the
        anonymous cookie is used only when no bearer token is present. For
        anonymous Core calls, the BFF sends a fresh assertion only through
        internal X-Chat-Assertion; it is not a browser-supplied request field.
        The anonymous chat_session cookie is non-persistent and lasts only for
        the browser session. A message mixing shop questions with personal,
        account, order, or transactional content is neither processed nor
        persisted; the buyer is asked to resubmit only the shop-related part.
        An unclear topic receives a shop-related clarification request without
        persistence or Core, retrieval, model, or tool calls. If it remains
        unclear or is out of scope, the BFF politely refuses without persisting
        or echoing the submitted text. English and Spanish questions are
        supported, and user-facing assistant text uses the language of the
        submitted question for FAQ answers, catalog recommendations, refusals,
        clarifications, and fallbacks. This does not relax shop-scope, privacy,
        ownership, grounding, or no-fabrication safeguards.
      operationId: sendChatMessage
      x-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
      responses:
        '200':
          description: A grounded answer, recommendation, refusal, or fallback.
          headers:
            Cache-Control:
              $ref: '#/components/headers/ChatNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatReplyResponse'
        '400':
          $ref: '#/components/responses/ChatInvalidRequest'
        '401':
          $ref: '#/components/responses/ChatUnauthorized'
        '404':
          $ref: '#/components/responses/ChatNotFound'
        '429':
          $ref: '#/components/responses/ChatRateLimited'
        '503':
          $ref: '#/components/responses/ChatUnavailable'
      security:
      - BearerAuth: []
      - ChatSessionCookie: []
  /api/v1/products:
    get:
      tags:
      - Products
      summary: List and filter board-game products
      description: Returns a paginated collection filtered by optional catalog criteria.
      operationId: listProducts
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/YearPublished'
      - $ref: '#/components/parameters/MinPlayers'
      - $ref: '#/components/parameters/MaxPlayers'
      - $ref: '#/components/parameters/CategoryId'
      - $ref: '#/components/parameters/CategoryName'
      - name: publisher
        in: query
        required: false
        description: >-
          Exact publisher name. Matching is case-sensitive after trimming
          surrounding whitespace and is combined with every other supplied
          filter using AND semantics.
        schema:
          type: string
          minLength: 1
          maxLength: 250
      - $ref: '#/components/parameters/PriceMin'
      - $ref: '#/components/parameters/PriceMax'
      responses:
        '200':
          description: Paginated product collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
              example:
                items:
                - bgg_id: 274364
                  name: Watergate
                  release_year: 2019
                  min_players: 2
                  max_players: 2
                  playing_time_minutes: 60
                  min_age: 12
                  weight: 2.25
                  category:
                  - Juegos de Estrategia
                  price: 90000.0
                  quantity: 10
                  publisher: Salt & Pepper Games
                  image_url: /media/portadas/2743640.webp
                page: 1
                page_size: 20
                total: 1
                total_pages: 1
        '400':
          description: The pagination or filter parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: page_size must not exceed 100
        '502':
          description: The BFF could not obtain a valid response from the Core GraphQL
            service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: upstream GraphQL request failed
                detail: GraphQL upstream returned errors
      security:
      - {}
      - BearerAuth: []
      - XOpKey: []
  /api/v1/coupons:
    get:
      tags:
      - Coupons
      summary: List available coupons
      description: >-
        Lists active coupons with remaining uses and configured validity dates
        containing the current time. This public read does not consume or
        reserve coupon uses. It does not guarantee availability at payment.
      operationId: listAvailableCoupons
      security:
      - {}
      responses:
        '200':
          description: Available coupons.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
