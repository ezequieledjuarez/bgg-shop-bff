openapi: 3.2.0
info:
  title: BGG Shop BFF API
  version: 1.0.0
  description: REST API exposed by the BFF for the board-game catalog, shopping cart, and purchase orders.
paths:
  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a customer account
      description: Creates a local customer account using email and password credentials.
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Customer account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Request body or registration data is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '409':
          description: An account with the email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '502':
          description: The BFF could not obtain a valid response from the Core GraphQL service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate a customer
      description: Authenticates a customer and merges any guest cart identified by the HttpOnly cart cookie.
      operationId: loginAccount
      parameters:
        - $ref: '#/components/parameters/GuestCartCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Customer authenticated successfully; the guest cart cookie is cleared after the Core merges it.
          headers:
            Set-Cookie:
              description: Clears the guest cart cookie after successful login.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '401':
          description: Email or password is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '502':
          description: The BFF could not obtain a valid response from the Core GraphQL service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/products:
    get:
      tags:
        - Products
      summary: List and filter board-game products
      description: Returns a paginated collection filtered by optional catalog criteria.
      operationId: listProducts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/YearPublished'
        - $ref: '#/components/parameters/MinPlayers'
        - $ref: '#/components/parameters/MaxPlayers'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/PriceMin'
        - $ref: '#/components/parameters/PriceMax'
      responses:
        '200':
          description: Paginated product collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
              example:
                items:
                  - bgg_id: 274364
                    name: Watergate
                    release_year: 2019
                    min_players: 2
                    max_players: 2
                    playing_time_minutes: 60
                    min_age: 12
                    weight: 2.25
                    category:
                      - Juegos de Estrategia
                    price: 90000.0
                    quantity: 10
                    publisher: Salt & Pepper Games
                    image_url: /media/portadas/2743640.webp
                page: 1
                page_size: 20
                total: 1
                total_pages: 1
        '400':
          description: The pagination or filter parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: page_size must not exceed 100
        '502':
          description: The BFF could not obtain a valid response from the Core GraphQL service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: upstream GraphQL request failed
                detail: GraphQL upstream returned errors
  /api/v1/cart:
    get:
      tags:
        - Cart
      summary: Read the current cart
      description: Reads the authenticated account cart when a Bearer token is provided; otherwise uses the opaque guest cart cookie.
      operationId: getCart
      parameters:
        - $ref: '#/components/parameters/GuestCartCookie'
      security:
        - {}
        - BearerAuth: []
      responses:
        '200':
          description: Current cart with current prices, available stock, and any cart warnings.
          headers:
            Set-Cookie:
              description: Sets or refreshes the HttpOnly guest cart cookie when the cart is anonymous.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
              example:
                lines:
                  - bgg_id: 274364
                    name: Watergate
                    quantity: 2
                    available_stock: 10
                    unit_price: 90000.0
                    subtotal: 180000.0
                total: 180000.0
                warnings: []
        '502':
          description: The BFF could not obtain a valid response from Core GraphQL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/cart/items:
    post:
      tags:
        - Cart
      summary: Add a product to the cart
      operationId: addCartItem
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GuestCartCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemRequest'
      responses:
        '200':
          description: Product added and cart totals recalculated.
          headers:
            Set-Cookie:
              description: Sets or refreshes the HttpOnly guest cart cookie when the cart is anonymous.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: The product identifier or quantity is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The product does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '409':
          description: Requested quantity exceeds current stock; the existing cart is returned with a warning.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '502':
          description: The BFF could not obtain a valid response from Core GraphQL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/cart/items/{bgg_id}:
    patch:
      tags:
        - Cart
      summary: Set a cart item's quantity
      operationId: updateCartItemQuantity
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GuestCartCookie'
        - name: bgg_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartQuantityRequest'
      responses:
        '200':
          description: Quantity updated and cart totals recalculated.
          headers:
            Set-Cookie:
              description: Sets or refreshes the HttpOnly guest cart cookie when the cart is anonymous.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: The product identifier or quantity is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The product does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '409':
          description: Requested quantity exceeds current stock; the existing cart is returned with a warning.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '502':
          description: The BFF could not obtain a valid response from Core GraphQL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Cart
      summary: Remove a product from the cart
      operationId: removeCartItem
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GuestCartCookie'
        - name: bgg_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        '200':
          description: Product removed and cart totals recalculated.
          headers:
            Set-Cookie:
              description: Sets or refreshes the HttpOnly guest cart cookie when the cart is anonymous.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: The product identifier is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The BFF could not obtain a valid response from Core GraphQL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/games/{slug}:
    get:
      tags:
        - Games
      summary: Get a board-game detail by slug
      operationId: getGameDetail
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Product detail with approved reviews.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
              example:
                name: Watergate
                release_year: 2019
                min_players: 2
                max_players: 2
                playing_time_minutes: 60
                min_age: 12
                weight: 2.25
                category:
                  - Juegos de Estrategia
                price: 90000.0
                quantity: 10
                publisher: Salt & Pepper Games
                image_url: /media/portadas/2743640.webp
                review_summary:
                  approved_review_count: 0
                  average_rating: null
                approved_reviews: []
        '404':
          description: The game does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The Core GraphQL service is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/games/{slug}/reviews:
    post:
      tags:
        - Reviews
      summary: Submit a board-game review
      operationId: createGameReview
      security:
        - BearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Review created and awaiting moderation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReviewResponse'
        '400':
          description: Review data is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The game does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The user already reviewed this game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The BFF could not obtain a valid response from the Core GraphQL service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                errors:
                  - code: UPSTREAM_ERROR
                    message: upstream GraphQL request failed
  /api/v1/checkout:
    post:
      tags: [Orders]
      summary: Create an order and initialize checkout payment
      operationId: checkout
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: Order and Mercado Pago checkout URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400':
          description: Request or shipping details are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '409':
          description: Current cart contents exceed available stock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '422':
          description: Cart is empty or the order cannot be paid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '502':
          description: Core is unavailable or payment initialization failed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OrderErrorResponse'
        '503':
          description: Payments are not configured in Core.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
  /api/v1/checkout/confirm:
    post:
      tags: [Orders]
      summary: Confirm payment with Core and return the order
      operationId: confirmCheckoutPayment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentRequest'
      responses:
        '200':
          description: Confirmed, pending, or rejected payment state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Request or payment identifier is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '404':
          description: The order does not exist or is not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '422':
          description: Core could not verify this payment for the order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '502':
          description: Core is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/orders:
    get:
      tags: [Orders]
      summary: List the authenticated customer's orders
      operationId: listOrders
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Orders belonging to the authenticated customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '502':
          description: Core is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/orders/{order_id}:
    get:
      tags: [Orders]
      summary: Get an owned order with lines and payment details
      operationId: getOrder
      security:
        - BearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order detail including shipping, invoice metadata, and rejection reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: The order identifier is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '404':
          description: The order does not exist or is not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '502':
          description: Core is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/orders/{order_id}/retry-payment:
    post:
      tags: [Orders]
      summary: Initialize a new payment attempt for a rejected order
      operationId: retryOrderPayment
      security:
        - BearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order and new checkout URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400':
          description: The order identifier is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '404':
          description: The order does not exist or is not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '422':
          description: The order cannot be paid again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '502':
          description: Core is unavailable or payment initialization failed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OrderErrorResponse'
        '503':
          description: Payments are not configured in Core.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
  /api/v1/orders/{order_id}/invoice:
    get:
      tags: [Orders]
      summary: Download the authenticated customer's invoice PDF
      operationId: downloadOrderInvoice
      security:
        - BearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invoice PDF streamed from Core.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: The order identifier is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
        '404':
          description: No invoice is available for this owned order.
        '502':
          description: Core is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    GuestCartCookie:
      name: cart_id
      in: cookie
      required: false
      description: Opaque guest cart identifier issued by the BFF in an HttpOnly, SameSite=Lax cookie. The default name is cart_id and can be changed with CART_COOKIE_NAME. Secure defaults on outside debug/development and is configurable with CART_COOKIE_SECURE. This is not a user identifier; Core selects authenticated carts from the Bearer token.
      schema:
        type: string
    Search:
      name: search
      in: query
      required: false
      description: Case-insensitive search over product name or publisher.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    YearPublished:
      name: year_published
      in: query
      required: false
      description: Exact publication year.
      schema:
        type: integer
        minimum: 0
        maximum: 9999
    MinPlayers:
      name: min_players
      in: query
      required: false
      description: Minimum requested player count.
      schema:
        type: integer
        minimum: 1
        maximum: 999
    MaxPlayers:
      name: max_players
      in: query
      required: false
      description: Maximum requested player count.
      schema:
        type: integer
        minimum: 1
        maximum: 999
    CategoryId:
      name: category_id
      in: query
      required: false
      description: Category identifier (1 strategy, 2 thematic, 3 family).
      schema:
        type: integer
        minimum: 1
    PriceMin:
      name: price_min
      in: query
      required: false
      description: Inclusive minimum price.
      schema:
        type: number
        format: double
        minimum: 0
    PriceMax:
      name: price_max
      in: query
      required: false
      description: Inclusive maximum price.
      schema:
        type: number
        format: double
        minimum: 0
    Page:
      name: page
      in: query
      required: false
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: Number of products per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
  schemas:
    CartItemRequest:
      type: object
      required:
        - bgg_id
        - quantity
      properties:
        bgg_id:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: BoardGameGeek product identifier.
        quantity:
          type: integer
          minimum: 1
          maximum: 2147483647
    CartQuantityRequest:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 2147483647
    CartLine:
      type: object
      required:
        - bgg_id
        - name
        - quantity
        - available_stock
        - unit_price
        - subtotal
      properties:
        bgg_id:
          type: integer
          minimum: 1
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        available_stock:
          type: integer
          minimum: 0
          description: Current product inventory; cart edits do not reserve stock.
        unit_price:
          type: number
          format: double
        subtotal:
          type: number
          format: double
    CartWarning:
      type: object
      required:
        - code
        - message
      properties:
        field:
          type: array
          nullable: true
          items:
            type: string
        code:
          type: string
          example: INSUFFICIENT_STOCK
        message:
          type: string
    CartResponse:
      type: object
      required:
        - lines
        - total
        - warnings
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CartLine'
        total:
          type: number
          format: double
        warnings:
          type: array
          description: Core cart userErrors, including stock-limit feedback.
          items:
            $ref: '#/components/schemas/CartWarning'
    CreateReviewRequest:
      type: object
      required:
        - rating
        - body
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        body:
          type: string
          minLength: 1
          maxLength: 2000
    CreateReviewResponse:
      type: object
      required:
        - created
        - status
        - created_at
      properties:
        created:
          type: boolean
        status:
          type: string
          enum:
            - PENDING
        created_at:
          type: string
          format: date-time
    ReviewSummary:
      type: object
      required:
        - approved_review_count
      properties:
        approved_review_count:
          type: integer
          minimum: 0
        average_rating:
          type: number
          format: double
          nullable: true
    ApprovedReview:
      type: object
      required:
        - rating
        - body
        - created_at
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        body:
          type: string
        created_at:
          type: string
          format: date-time
    ProductDetail:
      type: object
      required:
        - name
        - release_year
        - min_players
        - max_players
        - playing_time_minutes
        - min_age
        - weight
        - category
        - price
        - publisher
        - image_url
        - quantity
        - review_summary
        - approved_reviews
      properties:
        name:
          type: string
        release_year:
          type: integer
        min_players:
          type: integer
        max_players:
          type: integer
        playing_time_minutes:
          type: integer
        min_age:
          type: integer
        weight:
          type: number
        category:
          type: array
