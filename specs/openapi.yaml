          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
        first_name:
          type: string
          minLength: 1
          maxLength: 150
        last_name:
          type: string
          minLength: 1
          maxLength: 150
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
    AuthUser:
      type: object
      required:
        - id
        - email
        - first_name
        - last_name
        - is_active
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        is_active:
