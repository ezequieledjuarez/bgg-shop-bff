      responses:
        '200':
          description: A page of sessions without key material.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationSessionPage'
        '400':
          description: Invalid filter or pagination.
        '401':
          description: Authentication required.
        '403':
          description: Administrator permission required.
        '502':
          description: Core could not return the sessions.
  /api/v1/admin/op-sessions/{session_id}/revoke:
    post:
      tags:
      - Administration
      summary: Revoke an operation-key session
      operationId: adminRevokeOperationSession
      security:
      - BearerAuth: []
      - XOpKey: []
      parameters:
      - name: session_id
        in: path
