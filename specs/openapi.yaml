    CouponPreviewRequest:
      type: object
      additionalProperties: false
      required:
      - coupon_code
      properties:
        coupon_code:
          type: string
          minLength: 1
          description: Exact, case-sensitive coupon code; no normalization is applied.
    CouponPreviewResponse:
      type: object
      required:
      - valid
