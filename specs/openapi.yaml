        '502':
          description: Core could not confirm the operation.
  /api/v1/admin/op-sessions/{session_id}/expire:
    post:
      tags:
      - Administration
      summary: Expire an operation-key session
      operationId: adminExpireOperationSession
      security:
      - BearerAuth: []
      - XOpKey: []
      parameters:
      - name: session_id
        in: path
        required: true
