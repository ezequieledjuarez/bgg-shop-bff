  /api/v1/admin/products/{product_id}/stock:
    post:
      tags:
      - Administration
      summary: Adjust product stock
      description: >-
        UUID-bound IN/OUT movement. A provisional IN_PROGRESS record
        precedes the atomic stock, audit and final-result commit. A completed
        retry returns its original result; a retry with the same data resumes
        an unfinished movement without applying it twice, even after a long
        delay. A UUID reused for different product, direction or quantity is
        rejected. OUT is partial-to-zero when requested quantity exceeds
        available stock, with requested and applied quantities in the result.
        Successful movement identifiers do not expire. After an interrupted
        connection, refreshing stock alone does not confirm a movement outcome.
        A failed, rejected or no-change operation may be retried indefinitely
        with the same exact payload and UUID; an HTTP error or timeout alone
        does not confirm that stock rolled back.
        Requires an active staff or superuser account.
      operationId: adminAdjustProductStock
      security:
      - BearerAuth: []
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAdjustStockRequest'
      responses:
        '200':
          description: Applied movement or its original result on retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStockMovementResult'
        '202':
          description: Another attempt is executing the same movement; check its status or retry with the same data.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AdminStockMovementStatus'
                - type: object
                  properties:
                    status:
                      type: string
                      enum:
                      - IN_PROGRESS
        '400':
          $ref: '#/components/responses/AdminStockMovementRequestError'
        '401':
          $ref: '#/components/responses/AdminStockMovementRequestError'
        '403':
          $ref: '#/components/responses/AdminStockMovementRequestError'
        '404':
          $ref: '#/components/responses/AdminStockMovementRequestError'
        '409':
          description: UUID reused with different movement data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStockMovementError'
        '502':
          $ref: '#/components/responses/AdminStockMovementRequestError'
