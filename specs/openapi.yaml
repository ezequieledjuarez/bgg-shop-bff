      description: >-
        Delegates to Core adminUsers(search, cursor, limit). Requires a
        bearer-authenticated active is_superuser=true user, including when
        is_staff=false. Both backends authorize against current saved role state
        on every request, not token role claims. Staff-only, inactive and
        operation-key-only callers receive 403; missing/invalid authentication
        receives 401. Authorization precedes disclosure of personnel data.
        Includes inactive users and existing superusers. Returns only the safe
        user projection; never credentials or authentication secrets. Uses opaque
        signed cursor pagination ordered by user ID ascending. Search is a
        case-insensitive substring match over email, first_name and last_name.
        The cursor continues after the last user ID; limit defaults to 50 and
        has a maximum of 100. Existing staff operational access is unchanged.
        All responses are non-cacheable and all errors are sanitized.
      operationId: adminListUsers
      x-implementation-status: planned
      security:
      - BearerAuth: []
      parameters:
      - name: search
        in: query
        required: false
        description: >-
