    RegisterResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        session:
          $ref: '#/components/schemas/AuthSession'
          nullable: true
    LoginResponse:
      type: object
      required:
        - user
        - session
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        session:
          $ref: '#/components/schemas/AuthSession'
    Product:
      type: object
      required:
        - bgg_id
        - name
        - release_year
        - min_players
        - max_players
        - playing_time_minutes
        - min_age
        - weight
        - category
        - price
        - publisher
        - image_url
        - quantity
      properties:
        bgg_id:
          type: integer
          description: BoardGameGeek identifier.
          example: 274364
        name:
          type: string
          example: Watergate
        release_year:
          type: integer
          example: 2019
        min_players:
          type: integer
          example: 2
        max_players:
          type: integer
          example: 2
        playing_time_minutes:
          type: integer
          example: 60
        min_age:
          type: integer
          example: 12
        weight:
          type: number
          format: double
          example: 2.25
        category:
          type: array
          items:
            type: string
          example:
            - Juegos de Estrategia
        price:
          type: number
          format: double
          example: 90000.0
        publisher:
          type: string
          example: Salt & Pepper Games
        image_url:
          type: string
          example: /media/portadas/2743640.webp
        quantity:
          type: integer
          minimum: 0
          description: Current inventory available for this product.
          example: 10
    ProductPage:
      type: object
      required:
        - items
        - page
        - page_size
        - total
        - total_pages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
          minimum: 1
          example: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        total:
          type: integer
          minimum: 0
          example: 1
        total_pages:
          type: integer
          minimum: 0
          example: 1
    CheckoutRequest:
      type: object
      additionalProperties: false
      required: [shipping_mode]
      properties:
        shipping_mode:
          type: string
          enum: [standard, pickup]
        address:
          $ref: '#/components/schemas/ShippingAddress'
    ShippingAddress:
      type: object
      additionalProperties: false
      properties:
        recipient:
          type: string
          maxLength: 255
        street:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 255
        postal_code:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 255
    ConfirmPaymentRequest:
      type: object
      additionalProperties: false
      required: [order_id, payment_id]
      properties:
        order_id:
          type: string
          format: uuid
        payment_id:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 128
              pattern: '^[A-Za-z0-9._-]+$'
            - type: integer
              minimum: 0
    CheckoutResponse:
      type: object
      required: [order, init_point]
      properties:
        order:
          $ref: '#/components/schemas/PurchaseOrder'
        init_point:
          type: string
          format: uri
    OrderResponse:
      type: object
      required: [order]
      properties:
        order:
          $ref: '#/components/schemas/PurchaseOrder'
    OrderListResponse:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrder'
    PurchaseOrder:
      type: object
      required: [id, status, total, currency, shipping_mode, created_at, lines]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        total:
          type: number
          format: float
        currency:
          type: string
        shipping_mode:
          type: string
          enum: [standard, pickup]
        recipient:
          type: string
          nullable: true
        street:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        payment_status:
          type: string
          nullable: true
        payment_status_detail:
          type: string
          nullable: true
          description: Payment provider detail, including rejection reason.
        created_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time
          nullable: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderLine'
        invoice:
          allOf:
            - $ref: '#/components/schemas/Invoice'
          nullable: true
    PurchaseOrderLine:
      type: object
      required: [bgg_id, name, unit_price, quantity, subtotal]
      properties:
        bgg_id:
          type: integer
        name:
          type: string
        unit_price:
          type: number
          format: float
        quantity:
          type: integer
        subtotal:
          type: number
          format: float
    Invoice:
      type: object
      required: [number, issued_at, total]
      properties:
        number:
          type: integer
          format: int64
        issued_at:
          type: string
          format: date-time
        total:
          type: number
          format: float
    OrderErrorResponse:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
              message:
                type: string
              field:
                type: array
                nullable: true
                items:
                  type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Stable high-level error message.
          example: upstream GraphQL request failed
        detail:
          type: string
          description: Optional diagnostic detail.
          example: GraphQL upstream returned errors
