  /api/v1/admin/gift-cards:
    post:
      tags:
      - Administration
      summary: Issue a single-use gift card
      description: >-
        Creates a card for an administrator and returns its code only once.
        The code must not be logged or cached. Repeated requests create separate cards.
        All error fields must be sanitized and must never contain gift card codes
        or bearer tokens.
      operationId: adminCreateGiftCard
      security:
      - BearerAuth: []
      - XOpKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminGiftCardCreateRequest'
      responses:
        '201':
          description: Gift card issued; the code is returned only once.
          headers:
            Cache-Control:
              required: true
              description: Prevents the response containing the card code from being cached.
              schema:
                type: string
                enum:
                - no-store
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGiftCardCreateResponse'
        '400':
          description: Invalid amount or request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Administrator permission required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Core unavailable or invalid response; issuance outcome may be unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    XOpKey:
      type: apiKey
      in: header
      name: X-Op-Key
      description: Operations key for privileged internal operations (one-time raw
        key shown at creation).
    ChatSessionCookie:
      type: apiKey
      in: cookie
      name: chat_session
      description: >-
        Opaque BFF-issued browser-session credential for anonymous chat ownership.
        It is HttpOnly and SameSite=Lax, and Secure outside local development.
        It is non-persistent, has no Max-Age or Expires attribute, and lasts
        only for the browser session.
        It is not an owner ID or an assertion. For anonymous Core calls, the
        BFF derives a fresh HMAC-SHA256 assertion from this cookie and sends
        that assertion only in the internal X-Chat-Assertion header; the
        browser never supplies or receives it. Core validates the assertion
        and derives anonymous ownership only from its validated subject. When
        a bearer token is present, the authenticated user scope is authoritative
        and is not merged with or switched to the anonymous browser scope.
  parameters:
    CreditIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated UUID scoped to the authenticated buyer and operation.
        A repeated request with the same key and payload returns the original
        successful response snapshot without repeating effects, with no expiration.
        Core retains recorded rejections for 30 days; after expiration the key may
        be processed as a new request. A different payload reaching Core's
        idempotency check while a record exists returns 409. Validation
        in the BFF or Core may reject a request before that check. If the outcome is unknown after an upstream
        failure, retry the same request with the same key. Never persist raw card codes.
      schema:
        type: string
        format: uuid
    GuestCartCookie:
      name: cart_id
      in: cookie
      required: false
      description: Opaque guest cart identifier issued by the BFF in an HttpOnly,
        SameSite=Lax cookie. The default name is cart_id and can be changed with CART_COOKIE_NAME.
        Secure defaults on outside debug/development and is configurable with CART_COOKIE_SECURE.
        This is not a user identifier; Core selects authenticated carts from the Bearer
        token.
      schema:
        type: string
    Search:
      name: search
      in: query
      required: false
      description: Case-insensitive search over product name or publisher.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    YearPublished:
      name: year_published
      in: query
      required: false
      description: Exact publication year.
      schema:
        type: integer
        minimum: 0
        maximum: 9999
    MinPlayers:
      name: min_players
      in: query
      required: false
      description: Minimum requested player count.
      schema:
        type: integer
        minimum: 1
        maximum: 999
    MaxPlayers:
      name: max_players
      in: query
      required: false
      description: Maximum requested player count.
      schema:
        type: integer
        minimum: 1
        maximum: 999
    CategoryId:
      name: category_id
      in: query
      required: false
      description: Category identifier (1 strategy, 2 thematic, 3 family).
      schema:
        type: integer
        minimum: 1
    CategoryName:
      name: category_name
      in: query
      required: false
      description: Exact category name returned by the product categories endpoint.
      schema:
        type: string
        minLength: 1
    PriceMin:
      name: price_min
      in: query
      required: false
      description: Inclusive minimum price.
      schema:
        type: number
        format: double
        minimum: 0
    PriceMax:
      name: price_max
      in: query
      required: false
      description: Inclusive maximum price.
      schema:
        type: number
        format: double
        minimum: 0
    Page:
      name: page
      in: query
      required: false
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: Number of products per page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      example: 50
  headers:
    AuthNoStore:
      required: true
      description: Prevents caching of authentication and verification outcomes.
      schema:
        type: string
        enum:
        - no-store
    NoReferrer:
      required: true
      description: Prevents the verification page from leaking referrers.
      schema:
        type: string
        enum:
        - no-referrer
    RetryAfter:
      required: true
      description: Whole seconds, rounded up, until the caller limit permits another attempt. Never reveals recipient quota.
      schema:
        type: integer
        minimum: 1
    ChatNoStore:
      required: true
      description: Prevents caching of private chat content and session metadata.
      schema:
        type: string
        enum:
        - no-store
    UserManagementNoStore:
      required: true
      description: Prevents caching of personnel data and privilege-management responses.
      schema:
        type: string
        const: no-store
    AdminNoStore:
      required: true
      description: Prevents caching of moderation data and responses.
      schema:
        type: string
        const: no-store
    CreditCacheControl:
      required: true
      description: Prevents credit responses from being cached.
      schema:
        type: string
        enum:
        - no-store
  responses:
    VerificationMethodNotAllowed:
      description: Only POST is supported; the request has no side effects.
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthNoStore'
        Allow:
          description: Supported methods.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
    VerificationThrottled:
      description: The caller limit is reached, independent of email membership or token validity.
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthNoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VerificationThrottledResponse'
          example:
            errors:
            - code: RATE_LIMITED
              message: Too many attempts. Try again later.
            retry_after_seconds: 120
    VerificationUpstream:
      description: Core is unreachable or returned an invalid response; the outcome may be unknown and is never retried automatically.
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
          example:
            errors:
            - code: UPSTREAM_FAILURE
              message: The request could not be completed. Try again later.
    VerificationUnavailable:
      description: Limit or state storage or the trusted caller context is unavailable; fail closed with no send or consume.
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
          example:
            errors:
            - code: VERIFICATION_UNAVAILABLE
              message: Verification is temporarily unavailable. Try again later.
    ChatInvalidRequest:
      description: >-
        The message is blank or exceeds 2,000 characters. The response does not
        echo submitted content or include internal diagnostics.
      headers:
        Cache-Control:
          $ref: '#/components/headers/ChatNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChatErrorResponse'
    ChatUnauthorized:
      description: Missing or invalid authentication/session scope.
      headers:
        Cache-Control:
          $ref: '#/components/headers/ChatNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChatErrorResponse'
    ChatNotFound:
      description: >-
        The conversation is missing, expired, or owned by another user/session.
        The response does not reveal which condition occurred.
      headers:
        Cache-Control:
          $ref: '#/components/headers/ChatNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChatErrorResponse'
    ChatUnavailable:
      description: >-
        Core, approved knowledge retrieval, the local model provider, or the
        catalog capability is unavailable. Only a stable sanitized error is
        returned; no upstream exception, trace, URL, credential, or submitted
        content is exposed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/ChatNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChatErrorResponse'
    ChatRateLimited:
      description: The authenticated user or anonymous browser session exceeded 10 chatbot requests in one minute.
      headers:
        Cache-Control:
          $ref: '#/components/headers/ChatNoStore'
        Retry-After:
          required: true
          description: Minimum number of seconds before another chatbot request.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChatErrorResponse'
    UserManagementInvalidRequest:
      description: >-
        Invalid search, cursor, limit, user identifier or single-privilege body.
        Core INVALID maps to 400. Only sanitized public field errors are returned.
      headers:
        Cache-Control:
          $ref: '#/components/headers/UserManagementNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminFieldErrorResponse'
    UserManagementUnauthorized:
      description: Missing or invalid authentication; Core UNAUTHENTICATED maps to 401.
      headers:
        Cache-Control:
          $ref: '#/components/headers/UserManagementNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorResponse'
    UserManagementForbidden:
      description: >-
        Inactive, staff-only, other non-superuser or operation-key-only caller.
        Core FORBIDDEN maps to 403. No personnel data or privilege changes.
      headers:
        Cache-Control:
          $ref: '#/components/headers/UserManagementNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorResponse'
    UserManagementNotFound:
      description: Authorized caller's target user does not exist; Core NOT_FOUND maps to 404.
      headers:
        Cache-Control:
          $ref: '#/components/headers/UserManagementNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorResponse'
    UserManagementLastSuperuser:
      description: >-
        Revocation would leave no active superuser. No partial writes.
        Core LAST_ACTIVE_SUPERUSER maps to HTTP 409. The public code is
        LAST_ACTIVE_SUPERUSER and the message is sanitized, never raw upstream text.
      headers:
        Cache-Control:
          $ref: '#/components/headers/UserManagementNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserManagementLastSuperuserResponse'
    UserManagementUpstreamFailure:
      description: >-
        Core unavailable or invalid response. Never implies that an unknown
        mutation outcome was rolled back. Return only a stable public error;
        never forward upstream details, exceptions, traces, internal URLs,
        credentials or authentication secrets.
      headers:
        Cache-Control:
          $ref: '#/components/headers/UserManagementNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorResponse'
    ReviewModerationInvalidRequest:
      description: Invalid query or action; does not reveal upstream details.
      headers:
        Cache-Control:
          $ref: '#/components/headers/AdminNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReviewModerationFieldErrorResponse'
    ReviewModerationUnauthorized:
      description: Missing or invalid authentication.
      headers:
        Cache-Control:
          $ref: '#/components/headers/AdminNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorResponse'
    ReviewModerationForbidden:
      description: Authenticated user is not an active staff member or superuser.
      headers:
        Cache-Control:
          $ref: '#/components/headers/AdminNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorResponse'
    ReviewModerationNotFound:
      description: >-
        The review ID is unknown, or the review is soft-deleted and the requested
        action is not DELETE. DELETE on an already soft-deleted review succeeds.
      headers:
        Cache-Control:
          $ref: '#/components/headers/AdminNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorResponse'
    ReviewModerationConflict:
      description: A genuinely invalid state transition identified by Core. Concurrency, stale queue data, same-state actions, and repeated DELETE are not conflicts.
      headers:
        Cache-Control:
          $ref: '#/components/headers/AdminNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReviewModerationFieldErrorResponse'
    ReviewModerationUpstreamFailure:
      description: >-
        Core could not complete the request before committing a mutation;
        upstream details are not exposed. A committed mutation with pending cache
        refresh is returned as 200 with cache_refresh_pending=true instead.
      headers:
        Cache-Control:
          $ref: '#/components/headers/AdminNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReviewModerationUpstreamFailureResponse'
    AdminStockMovementRequestError:
      description: Sanitized error; a valid movement UUID is included when available.
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/AdminErrorResponse'
            - $ref: '#/components/schemas/AdminStockMovementError'
    AdminInvalidRequest:
      description: Invalid input or a sanitized field-level business error.
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/AdminErrorResponse'
            - $ref: '#/components/schemas/AdminFieldErrorResponse'
    AdminUnauthorized:
      description: Authentication is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorResponse'
    AdminForbidden:
      description: Administrative permission is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorResponse'
    AdminConflict:
      description: A coupon with the exact code already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminFieldErrorResponse'
    AdminCouponFailure:
      description: >-
        Core could not complete the coupon operation or returned an invalid
        response. Upstream failure details are not exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorResponse'
    AdminNotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorResponse'
    AdminUpstreamFailure:
      description: Core is unavailable or returned an invalid response; upstream details must not be exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorResponse'
    CreditInvalidRequest:
      description: Sanitized error for an invalid request body or idempotency key.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CreditCacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreditErrorResponse'
    CreditUnauthorized:
      description: Sanitized error for a missing or invalid bearer token.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CreditCacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreditErrorResponse'
    CreditUpstreamFailure:
      description: >-
        Core is unavailable or returned an invalid response. For POST requests the
        outcome may be unknown; retry the same request with the same idempotency key.
        The response must not include upstream information, gift card codes, or tokens.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CreditCacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreditUpstreamError'
  schemas:
    CatalogEvent:
      type: object
      additionalProperties: false
      required:
      - event_id
      - event_type
      - occurred_at
      - aggregate_type
      - aggregate_id
      properties:
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum:
          - product.changed
          - stock.changed
          - promotion.changed
        occurred_at:
          type: string
          format: date-time
          description: UTC timestamp ending in Z or with a zero UTC offset.
        aggregate_type:
          type: string
          description: Must match the event type prefix; stock aggregate IDs are product BGG IDs.
          enum:
          - product
          - stock
          - promotion
        aggregate_id:
          type: string
          description: Product BGG ID for product or stock events; promotion ID for promotion events.
          minLength: 1
          maxLength: 128
    ConfirmEmailVerificationRequest:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
          writeOnly: true
    ConfirmEmailVerificationResponse:
      type: object
      additionalProperties: false
      required:
      - verified
      - message
      properties:
        verified:
          type: boolean
          enum:
          - true
        message:
          type: string
    ResendEmailVerificationRequest:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
    ResendEmailVerificationResponse:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
          type: string
    VerificationThrottledResponse:
      type: object
      additionalProperties: false
      required:
      - errors
      - retry_after_seconds
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/AuthError'
        retry_after_seconds:
          type: integer
          minimum: 1
    RegistrationVerification:
      type: object
      additionalProperties: false
      required:
      - state
      - delivery_status
      - message
      properties:
        state:
          type: string
          enum:
          - PENDING
        delivery_status:
          type: string
          description: SUBMITTED means the transport accepted the message, not inbox delivery.
          enum:
          - SUBMITTED
          - UNCONFIRMED
        message:
          type: string
    AuthRefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          writeOnly: true
    AuthRefreshResponse:
      type: object
      required:
      - access_token
      properties:
        access_token:
          type: string
    AuthRefreshErrorResponse:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
    CreditErrorResponse:
      type: object
      additionalProperties: false
      description: >-
        All error fields must be sanitized and must never contain gift card codes
        or bearer tokens.
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - code
            - message
            properties:
              code:
                type: string
              message:
                type: string
                description: Sanitized public error message.
              field:
                type:
                - array
                - 'null'
                items:
                  type: string
    CreditUpstreamError:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: string
          enum:
          - Credit service unavailable
    CreditBalance:
      type: object
      additionalProperties: false
      required:
      - balance
      - currency
      properties:
        balance:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
          description: Available balance as a decimal string with two fractional digits.
          example: '20000.00'
        currency:
          type: string
          enum:
          - ARS
    RedeemGiftCardRequest:
      type: object
      additionalProperties: false
      required:
      - code
      properties:
        code:
          type: string
          writeOnly: true
          description: Sensitive single-use gift card code.
    CreditCheckoutResponse:
      type: object
      additionalProperties: false
      required:
      - order
      - credit
      properties:
        order:
          allOf:
          - $ref: '#/components/schemas/PurchaseOrder'
          - type: object
            required:
            - status
            - invoice
            properties:
              status:
                type: string
                enum:
                - paid
              invoice:
                $ref: '#/components/schemas/Invoice'
        credit:
          $ref: '#/components/schemas/CreditBalance'
    AdminGiftCardCreateRequest:
      type: object
      additionalProperties: false
      required:
      - amount
      properties:
        amount:
          type: string
          pattern: '^[0-9]{1,10}(\.[0-9]{1,2})?$'
          description: Positive amount in ARS, with up to two decimal places.
          example: '20000.00'
    AdminGiftCardCreateResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - code
      - amount
      - currency
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Sensitive redemption code returned only once.
        amount:
          type: string
          example: '20000.00'
        currency:
          type: string
          enum:
          - ARS
    CartItemRequest:
      type: object
      required:
      - bgg_id
      - quantity
      properties:
        bgg_id:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: BoardGameGeek product identifier.
        quantity:
          type: integer
          minimum: 1
          maximum: 2147483647
    CartQuantityRequest:
      type: object
      required:
      - quantity
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 2147483647
    CartLine:
      type: object
      required:
      - bgg_id
      - name
      - quantity
      - available_stock
      - unit_price
      - subtotal
      properties:
        bgg_id:
          type: integer
          minimum: 1
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        available_stock:
          type: integer
          minimum: 0
          description: Current product inventory; cart edits do not reserve stock.
        unit_price:
          type: number
          format: double
        subtotal:
          type: number
          format: double
    CartWarning:
      type: object
      required:
      - code
      - message
      properties:
        field:
          type: array
          nullable: true
          items:
            type: string
        code:
          type: string
          example: INSUFFICIENT_STOCK
        message:
          type: string
    CartResponse:
      type: object
      required:
      - lines
      - total
      - warnings
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CartLine'
        total:
          type: number
          format: double
        warnings:
          type: array
          description: Core cart userErrors, including stock-limit feedback.
          items:
            $ref: '#/components/schemas/CartWarning'
    CreateReviewRequest:
      type: object
      required:
      - rating
      - body
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        body:
          type: string
          minLength: 1
          maxLength: 2000
    ReviewError:
      type: object
      required:
      - code
      properties:
        code:
          type: string
        message:
          type: string
    ReviewErrorResponse:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ReviewError'
    CreateReviewResponse:
      type: object
      required:
      - created
      - status
      - created_at
      properties:
        created:
          type: boolean
        status:
          type: string
          enum:
          - PENDING
        created_at:
          type: string
          format: date-time
    ReviewSummary:
      type: object
      required:
      - approved_review_count
      properties:
        approved_review_count:
          type: integer
          minimum: 0
        average_rating:
          type: number
          format: double
          nullable: true
    ApprovedReview:
      type: object
      required:
      - rating
      - body
      - created_at
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        body:
          type: string
        created_at:
          type: string
          format: date-time
    ProductDetail:
      type: object
      required:
      - bgg_id
      - name
      - release_year
      - min_players
      - max_players
      - playing_time_minutes
      - min_age
      - weight
      - category
      - price
      - publisher
      - image_url
      - quantity
      - review_summary
      - approved_reviews
      properties:
        bgg_id:
          type: integer
          minimum: 1
          description: Public BoardGameGeek product identifier.
          example: 274364
        name:
          type: string
        release_year:
          type: integer
        min_players:
          type: integer
        max_players:
          type: integer
        playing_time_minutes:
          type: integer
        min_age:
          type: integer
        weight:
          type: number
        category:
          type: array
          items:
            type: string
        price:
          type: number
        publisher:
          type: string
        image_url:
          type: string
        quantity:
          type: integer
          minimum: 0
          description: Current inventory available for this product.
          example: 10
        review_summary:
          $ref: '#/components/schemas/ReviewSummary'
        approved_reviews:
          type: array
          items:
            $ref: '#/components/schemas/ApprovedReview'
    RegisterRequest:
      type: object
      required:
      - email
      - password
      - first_name
      - last_name
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          format: password
          description: Must include at least one ASCII uppercase letter, ASCII lowercase letter, ASCII digit, and printable ASCII punctuation character (not whitespace).
          pattern: '^(?=[\s\S]*[A-Z])(?=[\s\S]*[a-z])(?=[\s\S]*[0-9])(?=[\s\S]*[\x21-\x2F\x3A-\x40\x5B-\x60\x7B-\x7E])[\s\S]*$'
          minLength: 8
          maxLength: 128
          writeOnly: true
        first_name:
          type: string
          minLength: 1
          maxLength: 150
        last_name:
          type: string
          minLength: 1
          maxLength: 150
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
    AdminUser:
      type: object
      additionalProperties: false
      description: >-
        Exact safe projection of Core User for Superadmin-only personnel
        selection and privilege updates. Camel-case Core names map to these
        snake-case fields. Credentials and authentication secrets are excluded.
      required: [id, email, first_name, last_name, is_active, is_staff, is_superuser]
      properties:
        id:
          type: string
          description: Existing Core User.id, represented as a string like AuthUser.id.
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        is_active:
          type: boolean
        is_staff:
          type: boolean
        is_superuser:
          type: boolean
    AdminUserPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AdminUser'
        next_cursor:
          type: [string, 'null']
          description: Core nextCursor mapped unchanged; null at the end.
    AdminUpdateUserPrivilegeRequest:
      type: object
      additionalProperties: false
      required: [privilege, enabled]
      properties:
        privilege:
          type: string
          enum: [is_staff, is_superuser]
          description: Select exactly one existing privilege; no other account field may be updated.
        enabled:
          type: boolean
          description: Desired value of only the selected privilege; no coercion.
    UserManagementLastSuperuserResponse:
      type: object
      additionalProperties: false
      required: [errors]
      properties:
        errors:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
              code:
                type: string
                const: LAST_ACTIVE_SUPERUSER
              message:
                type: string
                description: Sanitized public message without upstream or internal details.
    CurrentUserCapabilities:
      type: object
      additionalProperties: false
      required: [is_staff, is_superuser]
      properties:
        is_staff:
          type: boolean
        is_superuser:
          type: boolean
    AuthUser:
      type: object
      required:
      - id
      - email
      - first_name
      - last_name
      - is_active
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        is_active:
          type: boolean
          description: Administrative activation only; true does not imply mailbox verification.
    OperationSession:
      type: object
      required: [id, ops, issued_at, revoked]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          nullable: true
        ops:
          type: array
          items:
            type: string
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used:
          type: string
          format: date-time
          nullable: true
        revoked:
          type: boolean
    OperationSessionPage:
      type: object
      required: [items, has_next]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OperationSession'
        has_next:
          type: boolean
    AuthSession:
      type: object
      required:
      - access_token
      - refresh_token
      properties:
        access_token:
          type: string
          description: JWT access token for Bearer authentication.
        refresh_token:
          type: string
          nullable: true
        csrf_token:
          type: string
          nullable: true
        op_key:
          type: string
          description: Optional one-time operation key issued to eligible users.
        op_key_expires_at:
          type: string
          nullable: true
          format: date-time
        ops:
          type: array
          nullable: true
          items:
            type: string
    AuthError:
      type: object
      required:
      - message
      properties:
        field:
          type: array
          nullable: true
          items:
            type: string
        code:
          type: string
          nullable: true
        message:
          type: string
    AuthErrorResponse:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/AuthError'
    RegisterResponse:
      type: object
      additionalProperties: false
      required:
      - user
      - verification
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        verification:
          $ref: '#/components/schemas/RegistrationVerification'
    LoginResponse:
      type: object
      required:
      - user
      - session
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        session:
          $ref: '#/components/schemas/AuthSession'
    Product:
      type: object
      required:
      - bgg_id
      - name
      - release_year
      - min_players
      - max_players
      - playing_time_minutes
      - min_age
      - weight
      - category
      - price
      - publisher
      - image_url
      - quantity
      properties:
        bgg_id:
          type: integer
          description: BoardGameGeek identifier.
          example: 274364
        name:
          type: string
          example: Watergate
        release_year:
          type: integer
          example: 2019
        min_players:
          type: integer
          example: 2
        max_players:
          type: integer
          example: 2
        playing_time_minutes:
          type: integer
          example: 60
        min_age:
          type: integer
          example: 12
        weight:
          type: number
          format: double
          example: 2.25
        category:
          type: array
          items:
            type: string
          example:
          - Juegos de Estrategia
        price:
          type: number
          format: double
          example: 90000.0
        publisher:
          type: string
          example: Salt & Pepper Games
        image_url:
          type: string
          example: /media/portadas/2743640.webp
        quantity:
          type: integer
          minimum: 0
          description: Current inventory available for this product.
          example: 10
    AdminProductFields:
      type: object
      additionalProperties: false
      properties:
        bgg_id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 250
        price:
          type: number
          exclusiveMinimum: 0
          description: Positive base price.
        quantity:
          type: integer
          minimum: 0
        release_year:
          type: integer
          minimum: 1
        min_players:
          type: integer
          minimum: 1
        max_players:
          type: integer
          minimum: 1
        playing_time_minutes:
          type: integer
          minimum: 1
        min_age:
          type: integer
          minimum: 0
        max_age:
          type: integer
          minimum: 0
        weight:
          type: number
          minimum: 0
        category:
          type: array
          items:
            type: string
        publisher:
          type: string
        image_file_name:
          type: string
          pattern: '\.webp$'
          description: A single .webp filename or path; mutually exclusive with image_url.
        image_url:
          type: string
          pattern: '\.webp$'
          description: A single .webp URL or path; mutually exclusive with image_file_name.
    AdminCreateProductRequest:
      allOf:
      - $ref: '#/components/schemas/AdminProductFields'
      - type: object
        required:
        - name
        - price
        - quantity
      oneOf:
      - required:
        - image_url
      - required:
        - image_file_name
    AdminUpdateProductRequest:
      allOf:
      - $ref: '#/components/schemas/AdminProductFields'
      - type: object
        minProperties: 1
        not:
          anyOf:
          - required:
            - bgg_id
          - required:
            - quantity
          - required:
            - image_url
            - image_file_name
    AdminProductSummary:
      type: object
      required:
      - bgg_id
      - name
      properties:
        bgg_id:
          type: integer
          minimum: 1
        name:
          type: string
    AdminAdjustStockRequest:
      type: object
      additionalProperties: false
      required:
      - movement_id
      - direction
      - quantity
      properties:
        movement_id:
          type: string
          format: uuid
        direction:
          type: string
          enum:
          - IN
          - OUT
        quantity:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Requested units for the movement.
          example: 20
    AdminStockMovementResult:
      type: object
      additionalProperties: false
      required:
      - movement_id
      - status
      - requested_quantity
      - applied_quantity
      - quantity_before
      - quantity_after
      properties:
        movement_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - APPLIED
        requested_quantity:
          type: integer
          minimum: 1
        applied_quantity:
          type: integer
          minimum: 0
        quantity_before:
          type: integer
          minimum: 0
        quantity_after:
          type: integer
          minimum: 0
        warning:
          type: string
          description: Present when an OUT movement is limited by available stock.
    AdminStockMovementId:
      type: object
      additionalProperties: false
      required:
      - movement_id
      properties:
        movement_id:
          type: string
          format: uuid
    AdminStockMovementStatus:
      type: object
      additionalProperties: false
      required:
      - movement_id
      - status
      properties:
        movement_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - IN_PROGRESS
          - APPLIED
          - REJECTED
    AdminStockMovementError:
      type: object
      additionalProperties: false
      required:
      - movement_id
      - error
      properties:
        movement_id:
          type: string
          format: uuid
        error:
          type: string
          description: Public error message without upstream details.
    AdminPromotionFields:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        discount_percent:
          type: number
          minimum: 0
          maximum: 50
          description: Percentage discount from zero through 50, inclusive.
        product_bgg_id:
          type: integer
          minimum: 1
          nullable: true
          description: >-
            Optional product BGG identifier; omitted or null means a global
            store offer. For each product, an eligible specific offer wins;
            otherwise the highest eligible global percentage applies. Offers
            do not stack. Coupon-linked promotion rows are not store offers.
        active:
          type: boolean
          description: >-
            Manual switch independent of validity dates. A disabled promotion
            must not apply even within its validity period; an enabled
            promotion remains subject to its dates. Existing promotions remain
            inactive when the field is introduced. At most one active
            promotion may reference each product.
    AdminCreatePromotionRequest:
      allOf:
      - $ref: '#/components/schemas/AdminPromotionFields'
      - type: object
        required:
        - name
        - discount_percent
        - active
    AdminCouponRequestFields:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: Exact-case unique coupon code; no normalization is applied.
        discount_percent:
          type: number
          minimum: 0
          maximum: 50
          description: Whole-purchase discount percentage, from zero through 50 inclusive.
        remaining:
          type: integer
          format: int64
          minimum: 0
          description: Number of uses remaining.
        active:
          type: boolean
        starts_at:
          type: string
          format: date-time
          nullable: true
          description: UTC validity start, inclusive; null means no lower bound.
        ends_at:
          type: string
          format: date-time
          nullable: true
          description: UTC validity end, exclusive; start must precede end when both exist.
    AdminCreateCouponRequest:
      allOf:
      - $ref: '#/components/schemas/AdminCouponRequestFields'
      - type: object
        required:
        - code
        - discount_percent
        - remaining
        - active
    AdminUpdateCouponRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        discount_percent:
          type: number
          minimum: 0
          maximum: 50
        remaining:
          type: integer
          format: int64
          minimum: 0
        active:
          type: boolean
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
    AdminAuditRecord:
      type: object
