          type: integer
          format: int64
          minimum: 0
          description: Number of uses remaining.
        active:
          type: boolean
        starts_at:
          type: string
          format: date-time
          nullable: true
          description: UTC validity start, inclusive; null means no lower bound.
        ends_at:
          type: string
          format: date-time
          nullable: true
